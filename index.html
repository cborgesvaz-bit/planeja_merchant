              onDrop={e=>{e.preventDefault();if(drag!==null)mover(drag,col.id);setDrag(null);setSobre(null);}}
              style={{flex:'0 0 290px',minWidth:290,background:ativa?'var(--bg3)':'var(--bg2)',borderRadius:12,border:'1px solid '+(ativa?col.c:'var(--border)'),borderTop:'3px solid '+col.c,padding:'11px 11px 9px',transition:'background .12s,border-color .12s'}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:10}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:col.c,flexShrink:0}}/>
                <span style={{fontSize:11.5,fontWeight:700,color:'var(--txt1)',flex:1}}>{col.lb}</span>
                <span style={{fontSize:10,fontWeight:700,color:col.c,background:col.c+'1A',padding:'1px 8px',borderRadius:99}}>{lista.length}</span>
              </div>

              {lista.length===0&&<div style={{fontSize:11,color:'var(--txt3)',padding:'12px 0',textAlign:'center',border:'1px dashed var(--border)',borderRadius:8,marginBottom:8}}>Arraste tarefas para cá</div>}

              {lista.map(t=>{
                const cfg=SC[t.s]||{c:'#6B7280',bg:'rgba(107,114,128,.1)'};
                const sub=parentOf(parents,t.id)!==null;
                const iniAndando=iStatus[t.g]&&iStatus[t.g]!=='Backlog';
                return(
                  <div key={t.id} draggable={canEdit}
                    onDragStart={()=>setDrag(t.id)} onDragEnd={()=>{setDrag(null);setSobre(null);}}
                    style={{background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:9,padding:'9px 10px',marginBottom:8,cursor:canEdit?'grab':'default',opacity:drag===t.id?.45:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,flexWrap:'wrap'}}>
                      <TipoBadge tipo={tipos[t.id]}/>
                      {sub&&<span title="Subtarefa" style={{color:'var(--txt3)',fontFamily:'monospace',fontSize:11}}>&#8627;</span>}
                      {t.c&&<span style={{fontFamily:'monospace',fontSize:10,color:'var(--txt2)',background:'var(--bg)',padding:'1px 5px',borderRadius:4,border:'1px solid var(--border)'}}>{t.c}</span>}
                      <span style={{fontSize:9.5,fontWeight:700,padding:'1px 7px',borderRadius:99,background:cfg.bg,color:cfg.c,marginLeft:'auto'}}>{t.s}</span>
                    </div>
                    <div onClick={()=>openEdit&&openEdit(t,{stopPropagation:()=>{}})} title={t.t}
                      style={{fontSize:12.5,color:'var(--txt1)',lineHeight:1.35,marginBottom:6,cursor:openEdit?'pointer':'default',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{t.t}</div>
                    <div title={iniAndando?'A iniciativa já está em '+iStatus[t.g]+' — a tarefa segue parada no backlog':'Iniciativa'}
                      style={{fontSize:10,color:iniAndando?'#B45309':'var(--txt3)',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {iniAndando?'● ':''}{t.g}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{flex:1,minWidth:0}}><RespAvatars r={t.r} size={19}/></div>
                      {canEdit&&<React.Fragment>
                        <button onClick={()=>passo(t,-1)} title="Coluna anterior" style={{width:22,height:22,borderRadius:6,border:'1px solid var(--border)',background:'transparent',color:'var(--txt3)',cursor:'pointer',fontSize:9,padding:0}}>&#9664;</button>
                        <button onClick={()=>passo(t,1)} title="Próxima coluna" style={{width:22,height:22,borderRadius:6,border:'1px solid var(--border)',background:'transparent',color:'var(--txt3)',cursor:'pointer',fontSize:9,padding:0}}>&#9654;</button>
                        <button onClick={()=>tirar(t)} title="Puxar para o board (sai do backlog)" style={{padding:'2px 9px',borderRadius:6,border:'1px solid rgba(5,150,105,.25)',background:'rgba(5,150,105,.08)',color:'#059669',cursor:'pointer',fontSize:10.5,fontWeight:700,whiteSpace:'nowrap'}}>Puxar</button>
                      </React.Fragment>}
                    </div>
                  </div>
                );
              })}

              {canEdit&&onAddBacklogTask&&(addCol===col.id
                ?<div style={{display:'flex',flexDirection:'column',gap:6}}>
                   <input autoFocus value={novo} onChange={e=>setNovo(e.target.value)}
                     onKeyDown={e=>{if(e.key==='Enter')criar(col.id);if(e.key==='Escape'){setAddCol(null);setNovo('');}}}
                     placeholder="Título da tarefa e Enter"
                     style={{width:'100%',fontSize:12,padding:'6px 9px',borderRadius:7,border:'1px solid var(--accent)',background:'var(--bg1)',color:'var(--txt1)',outline:'none'}}/>
                   <div style={{display:'flex',gap:6}}>
                     <button onClick={()=>criar(col.id)} disabled={!novo.trim()} style={{flex:1,padding:'5px 0',borderRadius:7,border:'none',background:novo.trim()?'var(--accent)':'var(--bg)',color:novo.trim()?'#fff':'var(--txt3)',fontSize:11.5,fontWeight:700,cursor:novo.trim()?'pointer':'default'}}>Adicionar</button>
                     <button onClick={()=>{setAddCol(null);setNovo('');}} style={{padding:'5px 12px',borderRadius:7,border:'1px solid var(--border)',background:'transparent',color:'var(--txt2)',fontSize:11.5,cursor:'pointer'}}>Cancelar</button>
                   </div>
                 </div>
                :<button onClick={()=>{setAddCol(col.id);setNovo('');}} style={{width:'100%',padding:'6px 0',borderRadius:7,border:'1px dashed var(--border2)',background:'transparent',color:'var(--txt3)',fontSize:11.5,fontWeight:600,cursor:'pointer'}}>+ Adicionar tarefa</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BacklogView({tasks,iStatus,statusProduto,setIStatus,openCreate,openEdit,parents={},tipos={},ordem={},setOrdem,openCreateSub,setTasks,onAddSub,backlog={},setBacklog,onAddBacklogTask,allG=[]}){
  const[modo,setModo]=useState('kanban');
  const[busca,setBusca]=useState('');
  const[fechadas,setFechadas]=useState(new Set());
  const[subAberto,setSubAberto]=useState(null);   // id do pai com o campo de subtarefa aberto
  const toggleFechada=g=>setFechadas(prev=>{const n=new Set(prev);n.has(g)?n.delete(g):n.add(g);return n;});
  const canOrder=Boolean(setOrdem);

  /* Uma iniciativa parada em Backlog entra inteira. As demais entram
     parcialmente: so as tarefas que estao no backlog (Nao Iniciado ou
     paradas de proposito), independente do status da iniciativa. */
  const grupoInteiro=g=>!iStatus[g]||iStatus[g]==='Backlog';
  const emBacklog=t=>Boolean(bkCol(backlog,t));
  const tarefasDo=g=>tasks.filter(t=>t.g===g&&(grupoInteiro(g)||emBacklog(t)));

  const backlogGrupos=useMemo(()=>{
    const grupos=[...new Set(tasks.map(t=>t.g))];
    return grupos
      .filter(g=>grupoInteiro(g)||tasks.some(t=>t.g===g&&emBacklog(t)))
      .sort((a,b)=>{
        const inteiroA=grupoInteiro(a),inteiroB=grupoInteiro(b);
        if(inteiroA!==inteiroB)return inteiroA?-1:1;   // iniciativas paradas primeiro
        const ta=tasks.find(t=>t.g===a),tb=tasks.find(t=>t.g===b);
        return(ta?tn(ta.t):0)-(tb?tn(tb.t):0);
      });
  },[tasks,iStatus,backlog]);

  const allTasks=backlogGrupos.flatMap(g=>tarefasDo(g));

  /* Ordenacao manual: `ordem[grupo]` guarda os ids na ordem escolhida.
     Quem ainda nao foi ordenado cai no fim, seguindo a numeracao da tarefa. */
  const posOf=(g,t)=>{
    const arr=(ordem&&ordem[g])||[];
    const i=arr.indexOf(t.id);
    return i>=0?i:1000000+tn(t.t);
  };
  const cmpG=g=>(a,b)=>posOf(g,a)-posOf(g,b);

  const listaDo=g=>{
    let gt=tarefasDo(g);
    if(busca){
      const q=busca.toLowerCase();
      const bate=t=>((t.t||'')+' '+(t.c||'')+' '+(t.r||'')).toLowerCase().includes(q);
      const ids=new Set(gt.filter(bate).map(t=>t.id));
      // mantem o pai visivel quando so a subtarefa casa com a busca (e vice-versa)
      gt.forEach(t=>{const pa=parentOf(parents,t.id);if(ids.has(t.id)&&pa!==null)ids.add(pa);});
      gt.forEach(t=>{const pa=parentOf(parents,t.id);if(pa!==null&&ids.has(pa))ids.add(t.id);});
      gt=gt.filter(t=>ids.has(t.id));
    }
    return hierarchize(gt,parents,cmpG(g));
  };

  // Move a tarefa entre os seus irmaos (mesmo pai) e regrava a ordem do grupo
  const mover=(g,task,dir)=>{
    if(!canOrder)return;
    const gt=tarefasDo(g);
    const pai=parentOf(parents,task.id);
    const irmaos=gt.filter(t=>parentOf(parents,t.id)===pai).sort(cmpG(g));
    const i=irmaos.findIndex(t=>t.id===task.id);
    const j=i+dir;
    if(i<0||j<0||j>=irmaos.length)return;
    const arr=[...irmaos];
    const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
    const rank=new Map();arr.forEach((t,k)=>rank.set(t.id,k));
    const rk=t=>rank.has(t.id)?rank.get(t.id):posOf(g,t);
    const ordenado=hierarchize(gt,parents,(a,b)=>rk(a)-rk(b));
    setOrdem(prev=>({...prev,[g]:ordenado.map(t=>t.id)}));
  };

  const SCOL={"Em andamento":"#0891B2","Bloqueado":"#DC2626","Nao Iniciado":"#6B7280","Aguard. Deploy PRD":"#B45309","Paralisado":"#EA580C","Finalizado":"#059669","Entregue":"#047857","Deploy PRD":"#0369A1","Pendente":"#7C3AED"};
  const btnIco={width:20,height:18,borderRadius:5,background:'transparent',border:'1px solid var(--border)',color:'var(--txt3)',cursor:'pointer',fontSize:9,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',padding:0};

  const trocaModo=(
    <div style={{display:'flex',gap:4,background:'var(--bg)',border:'1px solid var(--border2)',borderRadius:9,padding:3}}>
      {[['kanban','Kanban'],['lista','Por iniciativa']].map(([m,lbl])=>(
        <button key={m} onClick={()=>setModo(m)} style={{padding:'5px 12px',borderRadius:7,border:'none',fontSize:11.5,fontWeight:600,cursor:'pointer',background:modo===m?'var(--bg3)':'transparent',color:modo===m?'var(--accent)':'var(--txt2)'}}>{lbl}</button>
      ))}
    </div>
  );

  if(modo==='kanban')return <BacklogKanban tasks={tasks} backlog={backlog} setBacklog={setBacklog} setTasks={setTasks}
    openEdit={openEdit} tipos={tipos} parents={parents} iStatus={iStatus} allG={allG}
    onAddBacklogTask={onAddBacklogTask} trocaModo={trocaModo}/>;

  return(
    <div>
      <div style={{padding:'14px 24px 12px',borderBottom:'1px solid var(--border)',background:'var(--bg1)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {trocaModo}
          <div style={{width:8,height:8,borderRadius:'50%',background:'#6B7280'}}/>
          <span style={{fontSize:13,fontWeight:700,color:'var(--txt1)'}}>Backlog de Iniciativas</span>
          <span style={{fontSize:11,color:'var(--txt3)',background:'var(--bg2)',border:'1px solid var(--border)',padding:'1px 9px',borderRadius:99}}>{backlogGrupos.length} iniciativa{backlogGrupos.length!==1?'s':''} · {allTasks.length} tarefa{allTasks.length!==1?'s':''}</span>
          <span style={{fontSize:11,color:'var(--txt3)'}}>inclui tarefas não iniciadas de iniciativas já em andamento</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar no backlog..." style={{padding:'7px 11px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt1)',fontSize:12.5,outline:'none',minWidth:200}}/>
          {openCreate&&<button onClick={()=>openCreate()} style={{padding:'6px 16px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>+ Nova Tarefa</button>}
        </div>
      </div>

      {backlogGrupos.length===0
        ?<div style={{padding:'60px 24px',textAlign:'center',color:'var(--txt3)'}}>
           <div style={{fontSize:32,marginBottom:12}}>✅</div>
           <div style={{fontSize:14,fontWeight:600,color:'var(--txt2)'}}>Nenhuma iniciativa em Backlog</div>
           <div style={{fontSize:12,marginTop:4}}>Todas as iniciativas têm status definido</div>
         </div>
        :<div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:14}}>
           {backlogGrupos.map(grupo=>{
             const gtasks=tarefasDo(grupo);
             const parcial=!grupoInteiro(grupo);
             const lista=listaDo(grupo);
             const subs=gtasks.filter(t=>parentOf(parents,t.id)!==null).length;
             const smap={};
             gtasks.forEach(t=>{smap[t.s]=(smap[t.s]||0)+1;});
             const aberta=!fechadas.has(grupo);
             return(
               <div key={grupo} style={{background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
                 <div style={{padding:'14px 18px',borderBottom:aberta?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:10,background:'var(--bg2)'}}>
                   <button onClick={()=>toggleFechada(grupo)} title={aberta?'Recolher':'Expandir'} style={{background:'none',border:'none',color:'var(--txt3)',cursor:'pointer',padding:2,display:'flex',transform:aberta?'rotate(0deg)':'rotate(-90deg)',transition:'transform .15s'}}><Ic n="chevron" s={15} c="currentColor"/></button>
                   <div style={{flex:1,minWidth:0}}>
                     <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
                       <span style={{fontSize:14,fontWeight:700,color:'var(--txt1)'}}>{grupo}</span>
                       {parcial&&<span title="A iniciativa ja saiu do backlog — aqui aparecem so as tarefas nao iniciadas" style={{fontSize:10,fontWeight:700,padding:'1px 8px',borderRadius:99,background:getISCfg(iStatus[grupo]).bg,color:getISCfg(iStatus[grupo]).c,border:'1px solid '+getISCfg(iStatus[grupo]).c+'44'}}>{iStatus[grupo]}</span>}
                     </div>
                     <div style={{display:'flex',height:4,borderRadius:4,overflow:'hidden',marginTop:6,gap:1,maxWidth:200}}>
                       {Object.entries(smap).map(([st,n])=><div key={st} title={st+': '+n} style={{flex:n,background:SCOL[st]||'#9CA3AF',minWidth:2}}/>)}
                     </div>
                   </div>
                   <span style={{fontSize:11,color:'var(--txt3)',background:'var(--bg)',border:'1px solid var(--border)',padding:'2px 9px',borderRadius:99,whiteSpace:'nowrap'}}>{gtasks.length} tarefa{gtasks.length!==1?'s':''}{subs?' · '+subs+' sub':''}</span>
                   {openCreate&&<button onClick={()=>openCreate(grupo)} title="Adicionar tarefa nesta iniciativa" style={{padding:'4px 11px',borderRadius:7,background:'rgba(37,99,235,.08)',border:'1px solid rgba(37,99,235,.2)',color:'var(--accent)',fontSize:11.5,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>+ Tarefa</button>}
                   {setIStatus&&<select value={iStatus[grupo]||'Backlog'} onChange={e=>setIStatus(prev=>({...prev,[grupo]:e.target.value}))}
                     style={{fontSize:11,fontWeight:600,padding:'4px 10px',borderRadius:7,border:'1px solid rgba(107,114,128,.3)',background:'rgba(107,114,128,.08)',color:'#6B7280',cursor:'pointer',outline:'none'}}>
                     {statusProduto.map(st=><option key={st} value={st}>{st}</option>)}
                   </select>}
                 </div>
                 {aberta&&(lista.length===0
                   ?<div style={{padding:'16px 18px',fontSize:12,color:'var(--txt3)'}}>Nenhuma tarefa corresponde à busca.</div>
                   :<div>
                      {lista.map((t,i)=>{
                        const depth=t._depth||0;
                        const nSubs=childrenOf(gtasks,parents,t.id).length;
                        return(
                          <React.Fragment key={t.id}>
                          <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 18px',borderBottom:i<lista.length-1?'1px solid var(--border)':'none',background:depth?'var(--bg2)':'transparent'}}>
                            {canOrder&&<div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
                              <button onClick={()=>mover(grupo,t,-1)} title="Subir" style={btnIco}>&#9650;</button>
                              <button onClick={()=>mover(grupo,t,1)} title="Descer" style={btnIco}>&#9660;</button>
                            </div>}
                            <div style={{paddingLeft:depth*20,display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}}>
                              {depth>0&&<span title="Subtarefa" style={{color:'var(--txt3)',fontFamily:'monospace',fontSize:12,flexShrink:0}}>&#8627;</span>}
                              <span style={{width:7,height:7,borderRadius:'50%',background:SCOL[t.s]||'#9CA3AF',flexShrink:0}} title={t.s}/>
                              <TipoBadge tipo={tipos[t.id]}/>
                              {t.c&&<span style={{fontFamily:'monospace',fontSize:10.5,color:'var(--txt2)',background:'var(--bg)',padding:'1px 5px',borderRadius:4,border:'1px solid var(--border)',flexShrink:0}}>{t.c}</span>}
                              <span onClick={()=>openEdit&&openEdit(t,{stopPropagation:()=>{}})} title={t.t} style={{fontSize:12.5,color:'var(--txt1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:openEdit?'pointer':'default'}}>{t.t}</span>
                              {nSubs>0&&<span style={{fontSize:10,fontWeight:700,color:'var(--txt2)',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:99,padding:'1px 7px',flexShrink:0}}>{nSubs} sub</span>}
                            </div>
                            <div style={{flexShrink:0,maxWidth:170,overflow:'hidden'}}><RespAvatars r={t.r} size={20}/></div>
                            {depth>0&&setTasks&&<SubStatusSelect value={t.s} disabled={!openEdit} onChange={v=>setTasks(prev=>prev.map(x=>x.id===t.id?{...x,s:v}:x))}/>}
                            {onAddSub&&depth===0&&<button onClick={()=>setSubAberto(subAberto===t.id?null:t.id)} title="Adicionar subtarefa" style={{padding:'3px 9px',borderRadius:6,background:subAberto===t.id?'rgba(79,70,229,.1)':'transparent',border:'1px dashed '+(subAberto===t.id?'var(--accent)':'var(--border2)'),color:subAberto===t.id?'var(--accent)':'var(--txt2)',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>+ Sub</button>}
                            {openEdit&&<button onClick={()=>openEdit(t,{stopPropagation:()=>{}})} title="Editar" style={{width:26,height:26,borderRadius:7,background:'rgba(180,83,9,.07)',border:'1px solid rgba(180,83,9,.18)',color:'#B45309',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="edit" s={12} c="currentColor"/></button>}
                          </div>
                          {subAberto===t.id&&onAddSub&&
                            <div style={{padding:'8px 18px 10px 60px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
                              <SubtaskPanel pai={t} tasks={tasks} parents={parents} setTasks={setTasks} onAdd={onAddSub} canEdit={Boolean(openEdit)} compact/>
                            </div>}
                          </React.Fragment>
                        );
                      })}
                    </div>
                 )}
               </div>
             );
           })}
         </div>
      }
    </div>
  );
}

const roleFromSession=s=>(s&&s.user&&s.user.app_metadata&&s.user.app_metadata.role)||'viewer';

const taskToRow=t=>({id:t.id,'Iniciativa':t.g||'','Card':t.c||'','Tarefa':t.t||'','Status':t.s||'Nao Iniciado','Responsavel':t.r||'','Versao':t.v||'','Acompanhamento':t.a||'','Link MR':t.mr||'',plan_data:t.plan||''});
const rowToTask=r=>({id:r.id,g:r['Iniciativa']||'',c:r['Card']||'',t:r['Tarefa']||'',s:r['Status']||'Nao Iniciado',r:r['Responsavel']||'',v:r['Versao']||r.versao||'',a:r['Acompanhamento']||r.acompanhamento||'',mr:r['Link MR']||r.mr_links||'',plan:r.plan_data||''});

/* ── Times ─────────────────────────────────────────────
   teamId=null  =>  Visao Geral (agrega todos, leitura)
   ───────────────────────────────────────────────────── */
async function loadTeams(){
  const{data,error}=await sb.from('teams').select('id,nome,descricao').order('nome',{ascending:true});
  if(error){console.error('loadTeams',error);return{list:[],error};}
  return{list:data||[],error:null};
}
async function createTeam(nome,descricao){
  const{data,error}=await sb.from('teams').insert({nome,descricao:descricao||''}).select().single();
  if(error){console.error('createTeam',error);return null;}
  return data;
}
async function updateTeam(id,nome,descricao){
  const{error}=await sb.from('teams').update({nome,descricao:descricao||''}).eq('id',id);
  if(error)console.error('updateTeam',error);
}
async function deleteTeam(id){
  const{error}=await sb.from('teams').delete().eq('id',id);
  if(error)console.error('deleteTeam',error);
}

async function loadTasks(teamId){
  let q=sb.from('tasks').select('*').order('id',{ascending:true});
  if(teamId)q=q.eq('team_id',teamId);
  const{data,error}=await q;
  if(error){console.error('loadTasks',error);return null;}
  return data&&data.length?data.map(rowToTask):null;
}
async function saveTasks(tasks,teamId){
  if(!teamId)return; // Visao Geral e somente leitura
  const rows=tasks.map(t=>({...taskToRow(t),team_id:teamId}));
  const{error}=await sb.from('tasks').upsert(rows,{onConflict:'id'});
  if(error){console.error('saveTasks upsert',error);return;}
  // so remove tarefas DO TIME ATUAL — nunca de outros times
  const{data:all,error:e2}=await sb.from('tasks').select('id').eq('team_id',teamId);
  if(e2){console.error('saveTasks select',e2);return;}
  const keep=new Set(tasks.map(t=>t.id));
  const del=all.filter(r=>!keep.has(r.id)).map(r=>r.id);
  if(del.length){const{error:e3}=await sb.from('tasks').delete().in('id',del);if(e3)console.error('saveTasks delete',e3);}
}
async function loadStatusProduto(teamId){
  for(const tbl of['status produto','status_produto']){
    let q=sb.from(tbl).select('id,nome').order('id',{ascending:true});
    if(teamId)q=q.eq('team_id',teamId);
    const{data,error}=await q;
    if(error||!data||!data.length)continue;
    const merged={};
    data.forEach(r=>{merged[r.nome]=IS_CFG_BASE[r.nome]||{c:"#6B7280",bg:"rgba(107,114,128,.1)",dot:"#6B7280"};});
    IS_CFG={...IS_CFG_BASE,...merged};window._iscfg=merged;
    return data.map(r=>r.nome);
  }
  IS_CFG={...IS_CFG_BASE};window._iscfg={...IS_CFG_BASE};
  return Object.keys(IS_CFG_BASE);
}
/* ══════════════════════════════════════════════════════════════
   RESPONSAVEIS — sempre escopados por time.
   Cada time tem o seu proprio quadro de pessoas. Nada e global,
   nada vaza entre times e nao ha lista padrao de fallback.
   Toda operacao exige um teamId valido.
   ══════════════════════════════════════════════════════════════ */
const respsApi={
  async list(teamId){
    if(!teamId)return{list:[],error:null};   // Visao Geral: nao ha dono unico
    const{data,error}=await sb.from('responsavel')
      .select('id,nome').eq('team_id',teamId).order('nome',{ascending:true});
    if(error){console.error('respsApi.list',error);return{list:[],error};}
    const list=[...new Set((data||[]).map(r=>(r.nome||'').trim()).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,'pt-BR'));
    return{list,error:null};
  },
  async add(nome,teamId){
    if(!teamId)return{error:new Error('Selecione um time para cadastrar responsaveis.')};
    const n=(nome||'').trim();
    if(!n)return{error:new Error('Nome obrigatorio.')};
    const{error}=await sb.from('responsavel')
      .upsert({nome:n,team_id:teamId},{onConflict:'nome,team_id'});
    if(error)console.error('respsApi.add',error);
    return{error};
  },
  async remove(nome,teamId){
    if(!teamId)return{error:new Error('Selecione um time.')};
    const{error}=await sb.from('responsavel')
      .delete().eq('nome',nome).eq('team_id',teamId);
    if(error)console.error('respsApi.remove',error);
    return{error};
  },
  async rename(antigo,novo,teamId){
    if(!teamId)return{error:new Error('Selecione um time.')};
    const n=(novo||'').trim();
    if(!n)return{error:new Error('Nome obrigatorio.')};
    const{error}=await sb.from('responsavel')
      .update({nome:n}).eq('nome',antigo).eq('team_id',teamId);
    if(error)console.error('respsApi.rename',error);
    return{error};
  }
};

/* Hook que possui todo o ciclo de vida dos responsaveis do time ativo.
   Troca de time => recarrega do zero, sem herdar a lista anterior.
   Escritas sao otimistas com rollback em caso de erro. */
function useResponsaveis(teamId){
  const[resps,setResps]=useState([]);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const reqId=useRef(0);

  const reload=async()=>{
    const my=++reqId.current;
    setLoading(true);setError(null);
    const{list,error}=await respsApi.list(teamId);
    if(my!==reqId.current)return;            // resposta obsoleta: descarta
    if(error)setError(error.message||String(error));
    setResps(list);setLoading(false);
  };

  useEffect(()=>{
    setResps([]);                            // limpa na hora: nunca mostra o time anterior
    if(teamId===undefined)return;
    reload();
  },[teamId]);

  const mutate=async(optimistic,run)=>{
    const prev=resps;
    setResps([...optimistic].sort((a,b)=>a.localeCompare(b,'pt-BR')));
    const{error}=await run();
    if(error){setResps(prev);setError(error.message||String(error));return{error};}
    setError(null);return{error:null};
  };

  return{
    resps,loading,error,reload,
    add:nome=>{
      const n=(nome||'').trim();
      if(!n)return Promise.resolve({error:new Error('Nome obrigatorio.')});
      if(resps.some(r=>r.toLowerCase()===n.toLowerCase()))
        return Promise.resolve({error:new Error('Ja cadastrado neste time.')});
      return mutate([...resps,n],()=>respsApi.add(n,teamId));
    },
    remove:nome=>mutate(resps.filter(r=>r!==nome),()=>respsApi.remove(nome,teamId)),
    rename:(antigo,novo)=>{
      const n=(novo||'').trim();
      if(!n)return Promise.resolve({error:new Error('Nome obrigatorio.')});
      if(resps.some(r=>r.toLowerCase()===n.toLowerCase()&&r!==antigo))
        return Promise.resolve({error:new Error('Ja cadastrado neste time.')});
      return mutate(resps.map(r=>r===antigo?n:r),()=>respsApi.rename(antigo,n,teamId));
    }
  };
}
const nsKey=(key,teamId)=>teamId?teamId+':'+key:key;

async function dbGet(key,teamId){
  const{data,error}=await sb.from('pm_data').select('value').eq('key',nsKey(key,teamId)).maybeSingle();
  if(error){console.error('dbGet',key,error);return null;}
  return data?data.value:null;
}
async function dbSet(key,value,teamId){
  if(teamId===null)return; // Visao Geral nao grava
  const{error}=await sb.from('pm_data').upsert({key:nsKey(key,teamId),value,updated_at:new Date().toISOString()},{onConflict:'key'});
  if(error)console.error('dbSet',key,error);
}
// Visao Geral: junta a chave de todos os times
async function dbGetAll(key,teamIds){
  const out=await Promise.all(teamIds.map(id=>dbGet(key,id)));
  const objs=out.filter(v=>v&&typeof v==='object');
  if(objs.some(Array.isArray))return objs.filter(Array.isArray).flat();
  return Object.assign({},...objs);
}


/* ── Login (Supabase Auth: e-mail + senha) ───────────── */
function LoginScreen(){
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[show,setShow]=useState(false);
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const login=async()=>{
    setErr('');
    if(!email||!pass){setErr('Preencha e-mail e senha.');return;}
    setLoading(true);
    const{error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
    setLoading(false);
    if(error)setErr('E-mail ou senha incorretos.');
  };
  const inp={width:'100%',padding:'11px 12px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:9,color:'var(--txt1)',fontSize:14,outline:'none',boxSizing:'border-box'};
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:20}}>
      <div style={{width:'100%',maxWidth:380,background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:16,padding:32}}>
        <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:26}}>
          <div style={{width:38,height:38,borderRadius:10,background:'linear-gradient(135deg,var(--accent),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🧭</div>
          <div>
            <div style={{fontSize:17,fontWeight:800,color:'var(--txt1)',letterSpacing:-.3}}>Planeja Merchant</div>
            <div style={{fontSize:11,color:'var(--txt3)'}}>Gateway de Pagamentos Sésamo</div>
          </div>
        </div>
        <label style={{fontSize:11,fontWeight:600,color:'var(--txt2)'}}>E-mail</label>
        <input type="email" value={email} autoComplete="username" onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} style={{...inp,marginTop:6,marginBottom:14}}/>
        <label style={{fontSize:11,fontWeight:600,color:'var(--txt2)'}}>Senha</label>
        <div style={{position:'relative',marginTop:6}}>
          <input type={show?'text':'password'} value={pass} autoComplete="current-password" onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} style={{...inp,paddingRight:42}}/>
          <button type="button" onClick={()=>setShow(s=>!s)} style={{position:'absolute',right:8,top:8,background:'none',border:'none',color:'var(--txt3)',cursor:'pointer',fontSize:13}}>{show?'🙈':'👁'}</button>
        </div>
        {err&&<div style={{fontSize:12,color:'#DC2626',marginTop:10}}>{err}</div>}
        <button onClick={login} disabled={loading} style={{width:'100%',marginTop:16,padding:12,background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:9,color:'#fff',fontSize:14,fontWeight:700,cursor:loading?'default':'pointer',opacity:loading?.7:1}}>{loading?'Entrando...':'Entrar'}</button>
      </div>
    </div>
  );
}

/* ── Raiz ────────────────────────────────────────────── */
function App(){
  const[session,setSession]=useState(null);
  const[ready,setReady]=useState(false);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{setSession(data.session);setReady(true);});
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[]);
  if(!ready)return <LoadingScreen/>;
  if(!session)return <LoginScreen/>;
  const currentUser={
    id:session.user.id,
    email:session.user.email,
    name:(session.user.user_metadata&&session.user.user_metadata.name)||session.user.email.split('@')[0],
    role:roleFromSession(session),
  };
  return <AppMain currentUser={currentUser} onLogout={()=>sb.auth.signOut()}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script></body></html>
