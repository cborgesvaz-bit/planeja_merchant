  const setUsersState=u=>{setUsers(u);};
  const[form,setForm]=useState({name:'',email:'',pass:'',role:'editor'});
  const[editing,setEditing]=useState(null);
  const[errs,setErrs]=useState({});
  const[confirmDel,setConfirmDel]=useState(null);

  const saveAll=u=>{setUsersState(u);};

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name='Obrigatório';
    if(!form.email.trim()||!form.email.includes('@'))e.email='Email inválido';
    if(!editing&&!form.pass.trim())e.pass='Obrigatório';
    if(form.pass&&form.pass.length<4)e.pass='Mínimo 4 caracteres';
    const dup=users.find(u=>u.email.toLowerCase()===form.email.toLowerCase()&&u.id!==(editing?.id));
    if(dup)e.email='Email já cadastrado';
    return e;
  };

  const save=()=>{
    const e=validate();if(Object.keys(e).length){setErrs(e);return;}
    if(editing){
      saveAll(users.map(u=>u.id===editing.id?{...u,name:form.name,email:form.email,...(form.pass?{pass:form.pass}:{}),role:form.role}:u));
    }else{
      saveAll([...users,{id:Date.now(),name:form.name,email:form.email,pass:form.pass,role:form.role,active:true}]);
    }
    setForm({name:'',email:'',pass:'',role:'editor'});setEditing(null);setErrs({});
  };

  const startEdit=u=>{setEditing(u);setForm({name:u.name,email:u.email,pass:'',role:u.role});setErrs({});};
  const toggleActive=u=>saveAll(users.map(x=>x.id===u.id?{...x,active:!x.active}:x));
  const deleteUser=id=>{saveAll(users.filter(u=>u.id!==id));setConfirmDel(null);};

  const ist={width:'100%',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt1)',fontSize:13,padding:'8px 11px',outline:'none'};
  const Lbl=({c,err})=><div style={{marginBottom:5}}><span style={{fontSize:10,fontWeight:700,color:err?'#DC2626':'var(--txt3)',textTransform:'uppercase',letterSpacing:.7}}>{c}</span>{err&&<span style={{fontSize:10,color:'#DC2626',marginLeft:6}}>{err}</span>}</div>;

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:14,width:'min(820px,100%)',maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 16px 56px rgba(0,0,0,.2)'}}>
        <div style={{padding:'18px 24px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:'var(--txt1)'}}>Gerenciar Usuários</div>
            <div style={{fontSize:11,color:'var(--txt3)',marginTop:2}}>{users.length} usuário{users.length!==1?'s':''} cadastrado{users.length!==1?'s':''}</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'var(--txt2)',fontSize:18,cursor:'pointer'}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'20px 24px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>

          {/* Form */}
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--txt1)',marginBottom:14}}>{editing?'Editar usuário':'Novo usuário'}</div>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div><Lbl c="Nome" err={errs.name}/><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Nome completo" style={ist} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/></div>
              <div><Lbl c="Email" err={errs.email}/><input type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@exemplo.com" style={ist} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/></div>
              <div><Lbl c={editing?'Nova senha (deixe vazio para manter)':'Senha'} err={errs.pass}/><input type="password" value={form.pass} onChange={e=>setForm(f=>({...f,pass:e.target.value}))} placeholder={editing?'••••••••':'Mínimo 4 caracteres'} style={ist} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/></div>
              <div>
                <Lbl c="Perfil"/>
                <div style={{display:'flex',gap:8}}>
                  {Object.entries(ROLES).map(([k,v])=>(
                    <button key={k} onClick={()=>setForm(f=>({...f,role:k}))} style={{flex:1,padding:'7px 0',borderRadius:7,border:'1px solid '+(form.role===k?v.color+'66':'var(--border)'),background:form.role===k?v.bg:'transparent',color:form.role===k?v.color:'var(--txt2)',fontSize:11,fontWeight:600,cursor:'pointer'}}>
                      {v.label}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{display:'flex',gap:8,marginTop:4}}>
                {editing&&<button onClick={()=>{setEditing(null);setForm({name:'',email:'',pass:'',role:'editor'});setErrs({});}} style={{flex:1,padding:'9px',borderRadius:8,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>Cancelar</button>}
                <button onClick={save} style={{flex:2,padding:'9px',borderRadius:8,background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                  {editing?'Salvar alterações':'Criar usuário'}
                </button>
              </div>
            </div>
          </div>

          {/* User list */}
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--txt1)',marginBottom:14}}>Usuários cadastrados</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {users.map(u=>{
                const role=ROLES[u.role]||ROLES.viewer;
                return(
                  <div key={u.id} style={{background:u.active!==false?'var(--bg)':'rgba(0,0,0,.03)',border:'1px solid var(--border)',borderRadius:9,padding:'11px 13px',opacity:u.active===false?.6:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:9}}>
                      <div style={{width:34,height:34,borderRadius:9,background:role.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:role.color,flexShrink:0}}>
                        {u.name.slice(0,2).toUpperCase()}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,color:'var(--txt1)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.name}</div>
                        <div style={{fontSize:11,color:'var(--txt3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.email}</div>
                      </div>
                      <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:99,background:role.bg,color:role.color,flexShrink:0}}>{role.label}</span>
                    </div>
                    {confirmDel===u.id
                      ?<div style={{display:'flex',alignItems:'center',gap:7,marginTop:9,padding:'7px 10px',background:'rgba(220,38,38,.06)',borderRadius:7}}>
                         <span style={{fontSize:11,color:'#DC2626',flex:1}}>Confirmar exclusão?</span>
                         <button onClick={()=>deleteUser(u.id)} style={{padding:'3px 10px',borderRadius:5,background:'#DC2626',border:'none',color:'#fff',fontSize:11,cursor:'pointer'}}>Excluir</button>
                         <button onClick={()=>setConfirmDel(null)} style={{padding:'3px 10px',borderRadius:5,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:11,cursor:'pointer'}}>Cancelar</button>
                       </div>
                      :<div style={{display:'flex',gap:6,marginTop:9}}>
                         <button onClick={()=>startEdit(u)} style={{flex:1,padding:'4px 0',borderRadius:6,background:'rgba(251,191,36,.07)',border:'1px solid rgba(251,191,36,.2)',color:'#B45309',fontSize:11,cursor:'pointer'}}>Editar</button>
                         <button onClick={()=>toggleActive(u)} style={{flex:1,padding:'4px 0',borderRadius:6,background:u.active!==false?'rgba(107,114,128,.07)':'rgba(5,150,105,.07)',border:'1px solid '+(u.active!==false?'rgba(107,114,128,.2)':'rgba(5,150,105,.2)'),color:u.active!==false?'#6B7280':'#059669',fontSize:11,cursor:'pointer'}}>
                           {u.active!==false?'Desativar':'Ativar'}
                         </button>
                         {currentUser&&u.id!==currentUser.id&&<button onClick={()=>setConfirmDel(u.id)} style={{flex:1,padding:'4px 0',borderRadius:6,background:'rgba(220,38,38,.07)',border:'1px solid rgba(220,38,38,.2)',color:'#DC2626',fontSize:11,cursor:'pointer'}}>Excluir</button>}
                       </div>
                    }
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function KpiCard({label,value,sub,color}){
  return(
    <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'16px 18px',flex:'1 1 180px',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
      <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>{label}</div>
      <div style={{fontSize:28,fontWeight:800,color:color||'var(--txt1)',lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:'var(--txt3)',marginTop:6}}>{sub}</div>}
    </div>
  );
}
function BarRow({label,n,total,color}){
  const pct=total?Math.round(n/total*100):0;
  return(
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:9}}>
      <div style={{width:150,flexShrink:0,fontSize:11,color:'var(--txt2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</div>
      <div style={{flex:1,height:8,background:'var(--bg2)',borderRadius:99,overflow:'hidden'}}>
        <div style={{width:pct+'%',height:'100%',background:color||'var(--accent)',borderRadius:99}}/>
      </div>
      <div style={{width:34,textAlign:'right',fontSize:11,fontWeight:700,color:'var(--txt1)',flexShrink:0}}>{n}</div>
    </div>
  );
}
function DashboardView({tasks,iStatus={},riscos=[],deps=[]}){
  const total=tasks.length;
  const done=tasks.filter(t=>DONE.includes(t.s));
  const active=tasks.filter(t=>!DONE.includes(t.s));
  const bloqueadas=tasks.filter(t=>t.s==='Bloqueado').length;
  const statusCounts=useMemo(()=>{const m={};tasks.forEach(t=>{m[t.s]=(m[t.s]||0)+1;});return m;},[tasks]);
  const initStatusCounts=useMemo(()=>{
    const grupos=[...new Set(tasks.map(t=>t.g))];
    const m={};grupos.forEach(g=>{const s=iStatus[g]||'Backlog';m[s]=(m[s]||0)+1;});return m;
  },[tasks,iStatus]);
  const now=new Date();
  const entregasMes=useMemo(()=>{
    return done.filter(t=>{
      if(!t.a)return false;
      return t.a.split('\n').some(line=>{
        const m=line.match(/^(\d{1,2})\/(\d{1,2})/);
        if(!m)return false;
        if(!/deploy em prd/i.test(line))return false;
        return(+m[2]-1)===now.getMonth();
      });
    }).length;
  },[done]);
  const riscosAtivos=riscos.filter(r=>r.status==='Ativo');
  const riscosAltos=riscosAtivos.filter(r=>r.severidade==='Alta');
  const respCounts=useMemo(()=>{const m={};active.forEach(t=>{respList(t.r).forEach(r=>{m[r]=(m[r]||0)+1;});});return m;},[active]);

  // ---- Visao detalhada por iniciativa ----
  const initiatives=useMemo(()=>{
    const map={};
    const hoje=new Date();hoje.setHours(0,0,0,0);
    // Aceita a data em qualquer posicao da linha: 12/03, 12/03/26, 12-03...
    const eachDate=(txt,cb)=>{
      if(!txt)return;
      String(txt).split('\n').forEach(line=>{
        if(!line.trim())return;
        const re=/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/g;
        let m,found=null;
        while((m=re.exec(line))){
          const dia=+m[1],mes=+m[2];
          if(dia<1||dia>31||mes<1||mes>12)continue;
          let ano=m[3]?+m[3]:2026;
          if(ano<100)ano+=2000;
          const d=new Date(ano,mes-1,dia);
          if(isNaN(d))continue;
          found=d;break;
        }
        if(found)cb(found,line);
      });
    };
    tasks.forEach(t=>{
      const g=t.g||'Sem iniciativa';
      if(!map[g])map[g]={nome:g,status:iStatus[g]||'Backlog',total:0,done:0,bloq:0,andamento:0,resp:new Set(),ini:null,fim:null,prd:null,plan:false};
      const it=map[g];
      it.total++;
      if(DONE.includes(t.s))it.done++;
      else if(t.s==='Bloqueado')it.bloq++;
      else if(t.s==='Em andamento')it.andamento++;
      respList(t.r).forEach(r=>it.resp.add(r));
      const marca=(d,line,planejado)=>{
        if(!it.ini||d<it.ini)it.ini=d;
        if(!it.fim||d>it.fim)it.fim=d;
        if(/deploy em prd/i.test(line)&&(!it.prd||d>it.prd))it.prd=d;
        if(planejado&&d>hoje)it.plan=true;
      };
      eachDate(t.a,(d,l)=>marca(d,l,false));
      eachDate(t.plan,(d,l)=>marca(d,l,true));
    });
    return Object.values(map).map(i=>{
      const concluida=INIT_DONE_S.includes(i.status)||(i.total>0&&i.done===i.total);
      const fim=concluida?(i.prd||i.fim):i.fim;
      const dias=i.ini&&fim?Math.round((fim-i.ini)/864e5)+1:null;
      return{...i,resp:[...i.resp],pct:i.total?Math.round(i.done/i.total*100):0,concluida,fim,dias};
    });
  },[tasks,iStatus]);

  // Ordem das colunas: fluxo natural primeiro, status desconhecidos no meio
  // e "Concluido" sempre fixado como ultima coluna do board.
  const initColumns=useMemo(()=>{
    const fluxo=[...INIT_BACKLOG_S,...INIT_BOARD_S];
    const presentes=[...new Set(initiatives.map(i=>i.status))];
    const conhecidos=fluxo.filter(st=>presentes.includes(st));
    const desconhecidos=presentes.filter(st=>!fluxo.includes(st)&&!INIT_DONE_S.includes(st));
    const finais=INIT_DONE_S.filter(st=>presentes.includes(st));
    return[...conhecidos,...desconhecidos,...finais].map(st=>({
      status:st,
      cfg:getISCfg(st),
      itens:initiatives.filter(i=>i.status===st).sort((a,b)=>{
        if(a.ini&&b.ini&&+a.ini!==+b.ini)return a.ini-b.ini;
        if(a.ini&&!b.ini)return-1;
        if(!a.ini&&b.ini)return 1;
        return b.total-a.total;
      })
    }));
  },[initiatives]);

  const totalIniciativas=initiatives.length;
  const iniciativasRisco=initiatives.filter(i=>i.bloq>0).length;
  const semData=initiatives.filter(i=>!i.ini).length;

  return(
    <div style={{padding:'22px 24px 48px',maxWidth:1280,margin:'0 auto'}}>
      <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:24}}>
        <KpiCard label="Tarefas ativas" value={active.length} sub={total+' no total'} color="var(--accent)"/>
        <KpiCard label="Concluídas" value={done.length} sub="Finalizado + Entregue" color="#059669"/>
        <KpiCard label="Bloqueadas" value={bloqueadas} sub="Requerem atenção" color="#DC2626"/>
        <KpiCard label="Entregas no mês" value={entregasMes} sub="Deploy em PRD" color="#0369A1"/>
        <KpiCard label="Riscos ativos" value={riscosAtivos.length} sub={riscosAltos.length+' de severidade alta'} color={riscosAltos.length?'#DC2626':'#6B7280'}/>
        <KpiCard label="Dependências mapeadas" value={deps.length} color="#7C3AED"/>
      </div>

      <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
        <div style={{flex:'1 1 380px',background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)',marginBottom:14}}>Tarefas por status</div>
          {Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>(
            <BarRow key={s} label={s} n={n} total={total} color={(SC[s]&&SC[s].c)||'#9CA3AF'}/>
          ))}
        </div>
        <div style={{flex:'1 1 380px',background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)',marginBottom:14}}>Iniciativas por status</div>
          {Object.entries(initStatusCounts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>(
            <BarRow key={s} label={s} n={n} total={Object.values(initStatusCounts).reduce((a,b)=>a+b,0)} color={getISCfg(s).c}/>
          ))}
        </div>
        <div style={{flex:'1 1 380px',background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)',marginBottom:14}}>Carga por responsável (ativas)</div>
          {Object.keys(respCounts).length===0
            ?<div style={{fontSize:11,color:'var(--txt3)'}}>Nenhuma tarefa atribuída.</div>
            :Object.entries(respCounts).sort((a,b)=>b[1]-a[1]).map(([r,n])=>(
              <BarRow key={r} label={r} n={n} total={active.length} color="var(--cyan)"/>
            ))}
        </div>
        <div style={{flex:'1 1 380px',background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)'}}>Riscos em aberto</div>
            <span style={{fontSize:10,color:'var(--txt3)'}}>{riscosAtivos.length} ativo{riscosAtivos.length!==1?'s':''}</span>
          </div>
          {riscosAtivos.length===0
            ?<div style={{fontSize:11,color:'var(--txt3)'}}>Nenhum risco ativo mapeado.</div>
            :riscosAtivos.slice(0,6).map(r=>(
              <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:(RISK_SEV[r.severidade]||RISK_SEV.Media).c,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:'var(--txt1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.descricao}</div>
                  <div style={{fontSize:10,color:r.iniciativa?'var(--accent)':'var(--txt3)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.iniciativa||'Sem iniciativa vinculada'}</div>
                </div>
                <span style={{fontSize:10,fontWeight:700,color:(RISK_SEV[r.severidade]||RISK_SEV.Media).c,flexShrink:0}}>{r.severidade}</span>
              </div>
            ))}
        </div>
      </div>

      {/* ---- Visao por iniciativas ---- */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px',marginTop:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)'}}>Iniciativas por status</div>
            <div style={{fontSize:11,color:'var(--txt3)',marginTop:2}}>
              {totalIniciativas} iniciativa{totalIniciativas!==1?'s':''} · {initColumns.length} status em uso
              {iniciativasRisco>0&&<span style={{color:'#DC2626',fontWeight:600}}> · {iniciativasRisco} com tarefa bloqueada</span>}
              {semData>0&&<span> · {semData} sem data registrada</span>}
            </div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {initColumns.map(c=>(
              <span key={c.status} style={{fontSize:10,fontWeight:600,padding:'3px 9px',borderRadius:99,background:c.cfg.bg,color:c.cfg.c,border:'1px solid '+c.cfg.c+'33'}}>
                {c.itens.length} {c.status}
              </span>
            ))}
          </div>
        </div>

        {totalIniciativas===0
          ?<div style={{fontSize:12,color:'var(--txt3)',padding:'18px 0'}}>Nenhuma iniciativa cadastrada.</div>
          :<div style={{display:'flex',gap:14,overflowX:'auto',paddingBottom:6}}>
            {initColumns.map(col=>(
              <div key={col.status} style={{flex:'0 0 262px',minWidth:262,background:'var(--bg2)',borderRadius:10,border:'1px solid var(--border)',borderTop:'3px solid '+col.cfg.c,padding:'11px 11px 8px'}}>
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:10}}>
                  <span style={{width:7,height:7,borderRadius:'50%',background:col.cfg.c,flexShrink:0}}/>
                  <span style={{fontSize:11,fontWeight:700,color:'var(--txt1)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{col.status}</span>
                  <span style={{fontSize:10,fontWeight:700,color:col.cfg.c,background:col.cfg.bg,padding:'1px 7px',borderRadius:99}}>{col.itens.length}</span>
                </div>
                {col.itens.length===0
                  ?<div style={{fontSize:11,color:'var(--txt3)',padding:'8px 0'}}>—</div>
                  :col.itens.map(it=>(
                    <div key={it.nome} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',marginBottom:8}}>
                      <div title={it.nome} style={{fontSize:12,fontWeight:600,color:'var(--txt1)',lineHeight:1.35,marginBottom:7,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{it.nome}</div>
                      <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:6}}>
                        <div style={{flex:1,height:5,background:'var(--bg2)',borderRadius:99,overflow:'hidden'}}>
                          <div style={{width:it.pct+'%',height:'100%',background:it.pct===100?'#059669':col.cfg.c,borderRadius:99}}/>
                        </div>
                        <span style={{fontSize:10,fontWeight:700,color:'var(--txt2)',flexShrink:0}}>{it.pct}%</span>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,fontSize:10,color:'var(--txt2)'}}>
                        {it.ini
                          ?<React.Fragment>
                             <span title="Primeira movimentacao registrada" style={{display:'inline-flex',alignItems:'center',gap:3}}>
                               <span style={{width:5,height:5,borderRadius:'50%',background:'var(--txt3)'}}/>{fmtDate(it.ini)}
                             </span>
                             <span style={{flex:1,height:1,background:'var(--border)'}}/>
                             <span title={it.concluida?'Deploy em PRD / ultima movimentacao':'Ultima data prevista'} style={{display:'inline-flex',alignItems:'center',gap:3,fontWeight:600,color:it.concluida?'#059669':(it.plan?'#B45309':'var(--txt2)')}}>
                               {fmtDate(it.fim)}
                               <span style={{width:5,height:5,borderRadius:'50%',background:it.concluida?'#059669':(it.plan?'#B45309':'var(--txt3)')}}/>
                             </span>
                           </React.Fragment>
                          :<span style={{color:'var(--txt3)',fontStyle:'italic'}}>Sem datas registradas</span>}
                      </div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:5,fontSize:10,color:'var(--txt3)'}}>
                        <span>{it.done}/{it.total} tarefas</span>
                        {it.dias!==null&&<span>· {it.dias}d{it.concluida?'':' até agora'}</span>}
                        {it.andamento>0&&<span style={{color:'#0891B2',fontWeight:600}}>· {it.andamento} em andamento</span>}
                        {it.bloq>0&&<span style={{color:'#DC2626',fontWeight:700}}>· {it.bloq} bloqueada{it.bloq!==1?'s':''}</span>}
                      </div>
                      {it.resp.length>0&&
                        <div style={{fontSize:10,color:'var(--txt3)',marginTop:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          {it.resp.slice(0,3).join(', ')}{it.resp.length>3?' +'+(it.resp.length-3):''}
                        </div>}
                    </div>
                  ))}
              </div>
            ))}
          </div>}
      </div>
    </div>
  );
}

/* ── Gerenciador de Times ─────────────────────────────── */
function TeamManager({teams,setTeams,teamId,setTeamId,onClose}){
  const[form,setForm]=useState({nome:'',descricao:''});
  const[editing,setEditing]=useState(null);
  const[confirmDel,setConfirmDel]=useState(null);
  const[busy,setBusy]=useState(false);

  const add=async()=>{
    if(!form.nome.trim()||busy)return;
    setBusy(true);
    const t=await createTeam(form.nome.trim(),form.descricao.trim());
    setBusy(false);
    if(t){setTeams(prev=>[...prev,t].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')));setForm({nome:'',descricao:''});}
  };
  const save=async()=>{
    if(!editing.nome.trim())return;
    await updateTeam(editing.id,editing.nome.trim(),editing.descricao.trim());
    setTeams(prev=>prev.map(t=>t.id===editing.id?{...t,nome:editing.nome.trim(),descricao:editing.descricao.trim()}:t));
    setEditing(null);
  };
  const del=async id=>{
    await deleteTeam(id);
    setTeams(prev=>prev.filter(t=>t.id!==id));
    setConfirmDel(null);
    if(teamId===id)setTeamId(null);
  };

  const inp={padding:'8px 10px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:7,color:'var(--txt1)',fontSize:12,outline:'none',boxSizing:'border-box'};

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:560,maxHeight:'85vh',background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:14,display:'flex',flexDirection:'column'}}>
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',fontSize:14,fontWeight:700,color:'var(--txt1)'}}>Gerenciar times</div>

        <div style={{padding:'18px 22px',overflowY:'auto',flex:1}}>
          <div style={{display:'flex',gap:8,marginBottom:18}}>
            <input placeholder="Nome do time" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} onKeyDown={e=>e.key==='Enter'&&add()} style={{...inp,flex:1}}/>
            <input placeholder="Descrição (opcional)" value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} onKeyDown={e=>e.key==='Enter'&&add()} style={{...inp,flex:1}}/>
            <button onClick={add} disabled={busy} style={{padding:'8px 16px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:7,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Criar</button>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {teams.length===0&&<div style={{fontSize:12,color:'var(--txt3)'}}>Nenhum time cadastrado ainda.</div>}
            {teams.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:9,background:t.id===teamId?'var(--bg3)':'var(--bg2)',border:'1px solid '+(t.id===teamId?'var(--accent)':'var(--border)')}}>
                {editing&&editing.id===t.id
                  ?<React.Fragment>
                     <input value={editing.nome} onChange={e=>setEditing({...editing,nome:e.target.value})} style={{...inp,flex:1}}/>
                     <input value={editing.descricao} onChange={e=>setEditing({...editing,descricao:e.target.value})} style={{...inp,flex:1}}/>
                     <button onClick={save} style={{padding:'5px 12px',borderRadius:6,background:'rgba(5,150,105,.1)',border:'1px solid rgba(5,150,105,.25)',color:'#059669',fontSize:11,fontWeight:600,cursor:'pointer'}}>Salvar</button>
                     <button onClick={()=>setEditing(null)} style={{padding:'5px 10px',borderRadius:6,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:11,cursor:'pointer'}}>Cancelar</button>
                   </React.Fragment>
                  :<React.Fragment>
                     <div onClick={()=>{setTeamId(t.id);onClose();}} style={{flex:1,cursor:'pointer',minWidth:0}}>
                       <div style={{fontSize:12,fontWeight:700,color:'var(--txt1)'}}>{t.nome}</div>
                       {t.descricao&&<div style={{fontSize:10,color:'var(--txt3)'}}>{t.descricao}</div>}
                     </div>
                     {confirmDel===t.id
                       ?<div style={{display:'flex',gap:5,alignItems:'center',flexShrink:0}}>
                          <span style={{fontSize:11,color:'#DC2626'}}>Excluir tudo deste time?</span>
                          <button onClick={()=>del(t.id)} style={{padding:'4px 10px',borderRadius:5,background:'#DC2626',border:'none',color:'#fff',fontSize:11,fontWeight:600,cursor:'pointer'}}>Sim</button>
                          <button onClick={()=>setConfirmDel(null)} style={{padding:'4px 10px',borderRadius:5,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:11,cursor:'pointer'}}>Não</button>
                        </div>
                       :<div style={{display:'flex',gap:5,flexShrink:0}}>
                          <button onClick={()=>setEditing({id:t.id,nome:t.nome,descricao:t.descricao||''})} style={{padding:'4px 9px',borderRadius:6,background:'rgba(180,83,9,.07)',border:'1px solid rgba(180,83,9,.2)',color:'#B45309',fontSize:11,cursor:'pointer'}}>Editar</button>
                          <button onClick={()=>setConfirmDel(t.id)} style={{padding:'4px 9px',borderRadius:6,background:'rgba(220,38,38,.07)',border:'1px solid rgba(220,38,38,.2)',color:'#DC2626',fontSize:11,cursor:'pointer'}}>Excluir</button>
                        </div>
                     }
                   </React.Fragment>
                }
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:'var(--txt3)',marginTop:10}}>Clique no nome de um time para trocar o contexto ativo. Excluir um time remove permanentemente suas tarefas, responsáveis e status.</div>
        </div>

        <div style={{padding:'12px 22px',borderTop:'1px solid var(--border)',background:'var(--bg2)',borderRadius:'0 0 14px 14px'}}>
          <button onClick={onClose} style={{padding:'8px 22px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function AppMain({currentUser,onLogout}){
  const isAdmin=currentUser.role==='admin';
  const[teams,setTeams]=useState([]);
  const[teamId,setTeamId]=useState(()=>{
    try{
      const v=localStorage.getItem('pm_team');
      if(v==='all')return null;                                    // Visao Geral explicita
      if(!v||v==='null'||v==='undefined'||v==='NaN')return undefined;
      return v;                                                    // id e string (UUID)
    }catch(e){return undefined;}
  });
  const[showTeamMgr,setShowTeamMgr]=useState(false);
  const isValidId=v=>typeof v==='string'&&v.length>0&&v!=='all';
  const validTeamId=isValidId(teamId)?teamId:null;
  const isOverview=teamId===null;
  // sem time selecionado (Visao Geral) => somente leitura
  const canEdit=(currentUser.role==='admin'||currentUser.role==='editor')&&!!validTeamId;
  const team=teams.find(t=>t.id===validTeamId);
  // Auto-cura: se teamId for invalido (NaN, id inexistente) e existirem times, entra no primeiro
  useEffect(()=>{
    if(!teams.length)return;
    if(teamId===null)return;                 // Visao Geral escolhida de propósito
    if(teamId===undefined)return;            // ainda resolvendo
    if(teams.some(t=>String(t.id)===String(teamId)))return;  // já é válido
    console.warn('teamId inválido, corrigindo:',teamId);
    setTeamId(teams[0].id);
  },[teamId,teams]);
  useEffect(()=>{
    if(teamId===undefined)return; // ainda resolvendo: NAO sobrescrever o que esta salvo
    try{localStorage.setItem('pm_team',isValidId(teamId)?teamId:'all');}catch(e){}
  },[teamId]);
  const[showUserMgr,setShowUserMgr]=useState(false);
  const[showRespMgr,setShowRespMgr]=useState(false);
  const respsCtl=useResponsaveis(teamId);
  const resps=respsCtl.resps;
  const[users,setUsers]=useState(DEFAULT_USERS);
  const[statusProduto,setStatusProduto]=useState(['Backlog','Discovery Produto','Discovery Tecnico','Desenvolvimento','Homologacao','Pausado','Concluido']);
  const[theme,setTheme]=useState(()=>{try{return localStorage.getItem('pm_theme')||'light';}catch(e){return'light';}});
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    try{localStorage.setItem('pm_theme',theme);}catch(e){}
  },[theme]);
  const toggleTheme=()=>setTheme(t=>t==='light'?'dark':'light');
  const handleLogout=()=>{onLogout();};

  const[tasks,setTasks]=useState([]);
  const[iStatus,setIStatus]=useState({});
  const[tipos,setTipos]=useState({});
  const[parents,setParents]=useState({});   // {idSubtarefa:idPai}
  const[ordem,setOrdem]=useState({});       // {iniciativa:[ids na ordem do backlog]}
  const[backlog,setBacklog]=useState({});   // {idTarefa:coluna do kanban de backlog}
  const[deps,setDeps]=useState([]);
  const[riscos,setRiscos]=useState([]);
  const[nextId,setNextId]=useState(1);
  const[loaded,setLoaded]=useState(false);
  const[view,setView]=useState('dashboard');
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[editing,setEditing]=useState(null);
  const[toast,setToast]=useState(null);
  const[showIM,setShowIM]=useState(false);
  const[bulkCreate,setBulkCreate]=useState(null);
  const hasLocalData=true;
  const restoreDefaults=async()=>{window.location.reload();};

  // Carrega a lista de times primeiro
  const teamInit=useRef(false);
  const[teamsErr,setTeamsErr]=useState(null);
  const[teamsReady,setTeamsReady]=useState(false); // ja tentamos buscar os times?
  useEffect(()=>{
    (async()=>{
      let ts=[];
      try{
        const r=await loadTeams();
        ts=r.list;
        if(r.error)setTeamsErr(r.error.message||String(r.error));
      }catch(e){setTeamsErr(e.message||String(e));}
      setTeams(ts);
      if(!teamInit.current){
        teamInit.current=true;
        setTeamId(cur=>{
          if(cur&&ts.some(t=>String(t.id)===String(cur)))return cur; // time salvo ainda existe
          return ts.length?ts[0].id:null;                            // sem times: Visao Geral
        });
      }
      setTeamsReady(true); // libera o carregamento de dados, com ou sem times
    })();
  },[]);

  // Carrega os dados do time ativo (recarrega ao trocar de time)
  useEffect(()=>{
    if(!teamsReady)return;             // aguarda a resposta de loadTeams (uma vez só)
    setLoaded(false);
    (async()=>{
      try{
        const ids=teams.map(t=>t.id);
        const tid=validTeamId;
        const g=k=>tid?dbGet(k,tid):dbGetAll(k,ids);
        const[t,is,u,sp,tp,dp,rk,pa,od,bk]=await Promise.all([loadTasks(tid),g('istatus'),dbGet('users'),loadStatusProduto(tid),g('tipos'),g('dependencias'),g('riscos'),g('parents'),g('ordem'),g('backlog')]);
        if(Array.isArray(sp)&&sp.length>0)setStatusProduto(sp);
        const td=Array.isArray(t)&&t.length>0?t:[];
        setTasks(td);
        setNextId(Math.max(...td.map(x=>x.id||0),0)+1);
        if(is&&typeof is==='object')setIStatus(is);
        if(u&&Array.isArray(u)&&u.length>0)setUsers(u);
        if(tp&&typeof tp==='object')setTipos(tp);
        setParents(pa&&typeof pa==='object'&&!Array.isArray(pa)?pa:{});
        setOrdem(od&&typeof od==='object'&&!Array.isArray(od)?od:{});
        setBacklog(bk&&typeof bk==='object'&&!Array.isArray(bk)?bk:{});
        if(Array.isArray(dp))setDeps(dp);
        if(Array.isArray(rk))setRiscos(rk);
      }catch(e){console.error('Load error:',e);setTasks([]);setNextId(1);setParents({});setOrdem({});setBacklog({});}
      setLoaded(true);
    })();
  },[teamsReady,teams,validTeamId]);

  // Failsafe: a tela de carregamento nunca deve ficar presa para sempre
  useEffect(()=>{
    if(loaded)return;
    const t=setTimeout(()=>{
      console.warn('Timeout no carregamento — liberando a UI');
      setLoaded(true);setTeamsReady(true);
    },12000);
    return()=>clearTimeout(t);
  },[loaded]);

  // Save to Supabase (debounced)
  const rw=loaded&&!!validTeamId; // grava so com time valido selecionado
  useEffect(()=>{if(!rw||!tasks.length)return;const t=setTimeout(()=>saveTasks(tasks,validTeamId),600);return()=>clearTimeout(t);},[tasks,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('istatus',iStatus,validTeamId),600);return()=>clearTimeout(t);},[iStatus,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('users',users),600);return()=>clearTimeout(t);},[users,rw]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('tipos',tipos,validTeamId),600);return()=>clearTimeout(t);},[tipos,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('parents',parents,validTeamId),600);return()=>clearTimeout(t);},[parents,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('ordem',ordem,validTeamId),600);return()=>clearTimeout(t);},[ordem,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('backlog',backlog,validTeamId),600);return()=>clearTimeout(t);},[backlog,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('dependencias',deps,validTeamId),600);return()=>clearTimeout(t);},[deps,rw,validTeamId]);
  useEffect(()=>{if(!rw)return;const t=setTimeout(()=>dbSet('riscos',riscos,validTeamId),600);return()=>clearTimeout(t);},[riscos,rw,validTeamId]);
  const active=useMemo(()=>tasks.filter(t=>!DONE.includes(t.s)),[tasks]);
  // Tasks split by initiative status
  // tarefas paradas no backlog de proposito saem do board, mesmo que a iniciativa esteja andando
  const boardTasks=useMemo(()=>active.filter(t=>initView(iStatus[t.g])==='board'&&!bkManual(backlog,t)),[active,iStatus,backlog]);
  const historicoTasks=useMemo(()=>tasks.filter(t=>DONE.includes(t.s)||initView(iStatus[t.g])==='historico'),[tasks,iStatus]);
  const allG=useMemo(()=>[...new Set(tasks.map(t=>t.g))].sort((a,b)=>a.localeCompare(b,'pt-BR')),[tasks]);
  const sCounts=useMemo(()=>tasks.reduce((a,t)=>{a[t.s]=(a[t.s]||0)+1;return a;},{}),[tasks]);

  const openCreate=(group=null)=>{setEditing(group?{_preGroup:group}:null);setDrawerOpen(true);};
  const openEdit=(task,e)=>{e.stopPropagation();setEditing(task);setDrawerOpen(true);};
  const openCreateSub=pai=>{setEditing({_preGroup:pai.g,_preParent:pai.id});setDrawerOpen(true);};
  // criacao rapida de subtarefa direto na interface do item pai
  const addSub=(pai,titulo)=>handleSave({t:titulo,c:'',v:'',s:'Pendente',r:'',g:pai.g,tipo:'Tarefa',parent:pai.id,a:''},null);
  // tarefa criada direto numa coluna do kanban de backlog
  const addBacklogTask=(grupo,titulo,col)=>{
    const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const id=Math.max(nextId,tasks.reduce((m,t)=>Math.max(m,t.id||0),0)+1);
    setTasks(prev=>[...prev,{id,g:grupo,t:titulo,c:'',v:'',s:'Nao Iniciado',r:'',mr:'',a:hoje+' - Criado no backlog'}]);
    setNextId(id+1);
    setTipos(prev=>({...prev,[id]:'Tarefa'}));
    setBacklog(prev=>({...prev,[id]:col}));
    setToast('Tarefa adicionada ao backlog');
  };
  const handleMultiSave=(items,startId)=>{
    const today=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const newTasks=items.map((data,i)=>({...data,id:startId+i,a:data.a||today+' - Card criado'}));
    setTasks(prev=>[...prev,...newTasks]);
    setNextId(n=>n+newTasks.length);
    setTipos(prev=>{const n={...prev};newTasks.forEach(t=>{n[t.id]=t.tipo||'Tarefa';});return n;});
    setToast(newTasks.length+' card'+(newTasks.length!==1?'s':'')+' criado'+(newTasks.length!==1?'s':'')+' em "'+items[0].g+'"');
  };
  const setParent=(id,parent)=>setParents(prev=>{
    const n={...prev};
    if(parent==null||parent==='')delete n[id];
    else n[id]=Number(parent);
    return n;
  });
  const handleSave=(data,editId)=>{
    const{tipo,parent,...rest}=data;
    if(editId!=null){
      setTasks(prev=>prev.map(t=>t.id===editId?{...t,...rest}:t));
      setTipos(prev=>({...prev,[editId]:tipo||'Tarefa'}));
      setParent(editId,parent);
      setToast(parent?'Subtarefa atualizada!':'Tarefa atualizada!');
    }else{
      const today=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      const a=rest.a||today+' - Card criado';
      // protege contra colisao quando duas subtarefas sao criadas em sequencia
      const id=Math.max(nextId,tasks.reduce((m,t)=>Math.max(m,t.id||0),0)+1);
      setTasks(prev=>[...prev,{...rest,id,a}]);setNextId(id+1);
      setTipos(prev=>({...prev,[id]:tipo||'Tarefa'}));
      setParent(id,parent);
      // a subtarefa nasce logo abaixo do pai na ordem do backlog
      if(parent!=null)setOrdem(prev=>{
        const arr=[...((prev&&prev[rest.g])||[])];
        const i=arr.indexOf(Number(parent));
        if(i<0)return prev;
        arr.splice(i+1,0,id);
        return{...prev,[rest.g]:arr};
      });
      setToast(parent?'Subtarefa criada!':'Tarefa criada em "'+rest.g+'"');
    }
  };

  const VIEWS=[
    ['dashboard','Dashboard','📊'],
    ['board','Board','🗂️'],
    ['timeline','Timeline','📅'],
    ['backlog','Backlog','🗒️'],
    ['depriscos','Dependências & Riscos','🔗'],
    ['historico','Histórico','✅'],
  ];
  const viewLbl=(VIEWS.find(v=>v[0]===view)||[,'Planeja Merchant'])[1];

  if(!loaded)return <LoadingScreen/>;
  return(
    <div style={{background:'var(--bg)',minHeight:'100vh',display:'flex'}}>
      {/* ══ Sidebar ══ */}
      <div style={{width:230,flexShrink:0,background:'var(--sidebar-bg)',display:'flex',flexDirection:'column',position:'sticky',top:0,height:'100vh',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'20px 18px 18px'}}>
          <div style={{width:32,height:32,borderRadius:9,background:'linear-gradient(135deg,var(--accent),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:16}}>🧭</div>
          <div style={{fontSize:14,fontWeight:800,color:'#fff',letterSpacing:-.3,lineHeight:1.2}}>Planeja<br/>Merchant</div>
        </div>
        {/* ══ Seletor de time ══ */}
        <div style={{padding:'0 12px 12px'}}>
          <select value={validTeamId||'all'} onChange={e=>{const v=e.target.value;setTeamId(v==='all'?null:v);}}
            style={{width:'100%',padding:'8px 10px',borderRadius:8,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',outline:'none'}}>
            <option value="all" style={{color:'#111'}}>🌐 Visão Geral</option>
            {teams.map(t=><option key={t.id} value={String(t.id)} style={{color:'#111'}}>{t.nome}</option>)}
          </select>
          {isAdmin&&<button onClick={()=>setShowTeamMgr(true)} style={{width:'100%',marginTop:6,padding:'6px 10px',borderRadius:8,background:'transparent',border:'1px dashed rgba(255,255,255,.18)',color:'var(--sidebar-txt)',fontSize:11,fontWeight:600,cursor:'pointer'}}>⚙ Gerenciar times</button>}
          {isAdmin&&<button onClick={()=>setShowRespMgr(true)} style={{width:'100%',marginTop:6,padding:'6px 10px',borderRadius:8,background:'transparent',border:'1px dashed rgba(255,255,255,.18)',color:'var(--sidebar-txt)',fontSize:11,fontWeight:600,cursor:'pointer'}}>👥 Responsáveis do time</button>}
        </div>
        <div style={{padding:'4px 12px',display:'flex',flexDirection:'column',gap:2,flex:1}}>
          {VIEWS.map(([id,lbl,ico])=>(
            <button key={id} className="sb-item" onClick={()=>setView(id)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:8,border:'none',background:view===id?'rgba(255,255,255,.1)':'transparent',color:view===id?'var(--sidebar-txt-active)':'var(--sidebar-txt)',fontSize:13,fontWeight:view===id?700:500,cursor:'pointer',textAlign:'left',transition:'background .12s'}}>
              <span style={{fontSize:15,width:18,textAlign:'center',flexShrink:0}}>{ico}</span>
              <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{lbl}</span>
            </button>
          ))}
        </div>
        <div style={{padding:'12px',borderTop:'1px solid rgba(255,255,255,.08)',display:'flex',flexDirection:'column',gap:6}}>
          <div style={{fontSize:10,color:'var(--sidebar-txt)',opacity:.7,padding:'0 12px 4px'}}>{boardTasks.length} ativas · {tasks.filter(t=>DONE.includes(t.s)).length} concluídas</div>
          {hasLocalData&&<div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,background:'rgba(16,185,129,.12)'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#10B981',flexShrink:0}}/>
            <span style={{fontSize:10,fontWeight:600,color:'#34D399',flex:1}}>Supabase conectado</span>
            <button onClick={restoreDefaults} title="Restaurar dados originais" style={{background:'none',border:'none',color:'#34D399',cursor:'pointer',fontSize:11,padding:0,lineHeight:1}}>&#8635;</button>
          </div>}
        </div>
      </div>

      {/* ══ Main column ══ */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        {!canEdit&&<div style={{padding:'7px 24px',background:'var(--bg1)',borderBottom:'1px solid var(--border)',color:'var(--txt2)',fontSize:11.5,fontWeight:500,display:'flex',alignItems:'center',gap:8}}>
          <span style={{width:5,height:5,borderRadius:99,background:'var(--amber,#F59E0B)',flexShrink:0}}/>
          <span style={{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {teamsErr
              ? 'Falha ao carregar times — verifique as políticas de RLS no Supabase.'
              : !teams.length
                ? (isAdmin?'Crie um time em “Gerenciar times” para começar a editar.':'Peça a um administrador para criar um time.')
                : (currentUser.role==='admin'||currentUser.role==='editor')
                  ? 'Visão Geral é somente leitura — selecione um time para editar.'
                  : 'Seu perfil não permite edição.'}
          </span>
          {!!teams.length&&(currentUser.role==='admin'||currentUser.role==='editor')&&
            <button onClick={()=>setTeamId(teams[0].id)} style={{marginLeft:'auto',padding:'3px 10px',borderRadius:6,border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--txt)',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
              Entrar em {teams[0].nome}
            </button>}
        </div>}
        <div style={{background:'var(--bg1)',borderBottom:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',position:'sticky',top:0,zIndex:100}}>
          <div style={{padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:60,gap:12}}>
            <div style={{display:'flex',alignItems:'center',gap:9,flexShrink:0,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:700,color:'var(--txt1)'}}>{viewLbl}</div>
              <span style={{padding:'3px 10px',borderRadius:99,fontSize:10,fontWeight:700,whiteSpace:'nowrap',background:isOverview?'rgba(99,102,241,.12)':'var(--bg2)',border:'1px solid '+(isOverview?'rgba(99,102,241,.3)':'var(--border)'),color:isOverview?'#6366F1':'var(--txt2)'}}>
                {isOverview?'🌐 Visão Geral · somente leitura':(team?team.nome:'Sem time')}
              </span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
              {Object.entries(sCounts).map(([s,n])=>{const cfg=SC[s]||{c:'#9CA3AF',bg:'rgba(156,163,175,.08)',d:'#9CA3AF'};return(
                <div key={s} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 11px',borderRadius:99,background:cfg.bg,border:'1px solid '+cfg.c+'44',whiteSpace:'nowrap',boxShadow:'var(--shadow-sm)'}}>
                  <span style={{fontSize:14,fontWeight:700,color:cfg.c,lineHeight:1}}>{n}</span>
                  <span style={{fontSize:11,fontWeight:500,color:cfg.c,opacity:.9}}>{s}</span>
                </div>
              );})}
              <button onClick={toggleTheme} title={theme==='light'?'Modo escuro':'Modo claro'} style={{width:30,height:30,borderRadius:99,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--txt2)',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{theme==='light'?'🌙':'☀️'}</button>
              <button onClick={()=>exportXLSX(tasks,parents,tipos)} style={{padding:'5px 11px',background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.25)',borderRadius:99,color:'#34D399',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>Excel</button>
              <button onClick={()=>setShowIM(true)} style={{padding:'5px 11px',background:'rgba(167,139,250,.1)',border:'1px solid rgba(167,139,250,.25)',borderRadius:99,color:'#A78BFA',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>Iniciativas</button>
              {canEdit&&openCreate&&<button onClick={openCreate} style={{padding:'6px 18px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:99,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>+ Nova Tarefa</button>}
              {/* User menu */}
              <div style={{display:'flex',alignItems:'center',gap:7,padding:'5px 10px',borderRadius:99,background:'var(--bg2)',border:'1px solid var(--border)',flexShrink:0}}>
                <div style={{width:26,height:26,borderRadius:'50%',background:ROLES[currentUser.role]?.bg||'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:ROLES[currentUser.role]?.color||'var(--txt2)',flexShrink:0}}>
                  {currentUser.name.slice(0,2).toUpperCase()}
                </div>
                <div style={{lineHeight:1.2}}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--txt1)',whiteSpace:'nowrap'}}>{currentUser.name}</div>
                  <div style={{fontSize:9,color:'var(--txt3)'}}>{ROLES[currentUser.role]?.label||currentUser.role}</div>
                </div>
                {isAdmin&&<button onClick={()=>setShowRespMgr(true)} title="Gerenciar responsáveis" style={{background:'none',border:'none',color:'var(--txt3)',cursor:'pointer',padding:'2px',fontSize:14,lineHeight:1}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 018 0v2"/><line x1="19" y1="11" x2="19" y2="17"/><line x1="16" y1="14" x2="22" y2="14"/></svg></button>}
                {isAdmin&&<button onClick={()=>setShowUserMgr(true)} title="Gerenciar usuários" style={{background:'none',border:'none',color:'var(--txt3)',cursor:'pointer',padding:'2px',fontSize:14,lineHeight:1}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                </button>}
                <button onClick={handleLogout} title="Sair" style={{background:'none',border:'none',color:'var(--txt3)',cursor:'pointer',padding:'2px',fontSize:14,lineHeight:1}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          {view==='dashboard'?<DashboardView tasks={tasks} iStatus={iStatus} riscos={riscos} deps={deps}/>
            :view==='board'?<BoardView tasks={boardTasks} setTasks={setTasks} openCreate={canEdit?openCreate:null} openEdit={canEdit?openEdit:null} iStatus={iStatus} setIStatus={canEdit?setIStatus:null} openBulkCreate={canEdit?setBulkCreate:null} statusProduto={statusProduto} tipos={tipos} resps={resps} parents={parents} openCreateSub={canEdit?openCreateSub:null} allTasks={tasks} onAddSub={canEdit?addSub:null}/>
            :view==='timeline'?<Timeline tasks={boardTasks} setTasks={setTasks} iStatus={iStatus} setIStatus={setIStatus}/>
            :view==='backlog'?<BacklogView tasks={tasks} iStatus={iStatus} statusProduto={statusProduto} setIStatus={canEdit?setIStatus:null} openCreate={canEdit?openCreate:null} openEdit={canEdit?openEdit:null} parents={parents} tipos={tipos} ordem={ordem} setOrdem={canEdit?setOrdem:null} openCreateSub={canEdit?openCreateSub:null} setTasks={canEdit?setTasks:null} onAddSub={canEdit?addSub:null} backlog={backlog} setBacklog={canEdit?setBacklog:null} onAddBacklogTask={canEdit?addBacklogTask:null} allG={allG}/>
            :view==='depriscos'?<DependenciasRiscosView tasks={tasks} deps={deps} setDeps={setDeps} riscos={riscos} setRiscos={setRiscos} allG={allG} canEdit={canEdit}/>
            :<HistoricoView tasks={historicoTasks} setTasks={setTasks} openEdit={openEdit} iStatus={iStatus} setIStatus={canEdit?setIStatus:null} statusProduto={statusProduto} openBulkCreate={canEdit?setBulkCreate:null} canEdit={canEdit}/>}
        </div>
      </div>
      <Drawer open={drawerOpen} onClose={()=>setDrawerOpen(false)} onSave={handleSave} grupos={allG} parents={parents} tasks={tasks} allResp={[...new Set([...resps,...(editing?respList(editing.r):[])])].sort((a,b)=>a.localeCompare(b,'pt-BR'))} editing={editing} tipos={tipos}/>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      {showIM&&<InitiativeManager tasks={tasks} setTasks={setTasks} iStatus={iStatus} setIStatus={setIStatus} onClose={()=>setShowIM(false)}/>}
      {showTeamMgr&&<TeamManager teams={teams} setTeams={setTeams} teamId={validTeamId} setTeamId={setTeamId} onClose={()=>setShowTeamMgr(false)}/>}
      {showUserMgr&&<UserManager currentUser={currentUser} users={users} setUsers={setUsers} onClose={()=>setShowUserMgr(false)}/>}
      {showRespMgr&&<ResponsavelManager ctl={respsCtl} teamId={validTeamId} teamNome={team?team.nome:''} teams={teams} setTeamId={setTeamId} tasks={tasks} setTasks={setTasks} canEdit={canEdit} onClose={()=>setShowRespMgr(false)}/>}
      {bulkCreate&&<BulkCreateModal grupo={bulkCreate} onSave={handleMultiSave} onClose={()=>setBulkCreate(null)} nextId={nextId} allResp={resps}/>}
    </div>
  );
}


/* ── Responsavel Manager ──────────────────────────────── */

function ResponsavelManager({ctl,onClose,teamId,teamNome,teams=[],setTeamId,tasks=[],setTasks,canEdit=true}){
  const{resps,loading,error,add,remove,rename,reload}=ctl;
  const[newName,setNewName]=useState('');
  const[bulk,setBulk]=useState('');
  const[showBulk,setShowBulk]=useState(false);
  const[search,setSearch]=useState('');
  const[editing,setEditing]=useState(null);   // {nome,draft,err}
  const[confirmDel,setConfirmDel]=useState(null); // {nome,reassign}
  const[moving,setMoving]=useState(null);     // {nome,destino,modo}
  const[err,setErr]=useState('');
  const[busy,setBusy]=useState(false);
  const[flash,setFlash]=useState('');
  const inputRef=useRef(null);
  const locked=!teamId||!canEdit;

  useEffect(()=>{if(flash){const t=setTimeout(()=>setFlash(''),2600);return()=>clearTimeout(t);}},[flash]);

  const ATIVOS=['Finalizado','Entregue','Cancelado'];
  const carga=useMemo(()=>{
    const m={};
    (tasks||[]).forEach(t=>{
      respList(t.r).forEach(r=>{
        if(!m[r])m[r]={total:0,ativas:0};
        m[r].total++;
        if(!ATIVOS.includes(t.s))m[r].ativas++;
      });
    });
    return m;
  },[tasks]);

  // pessoas que aparecem em tarefas mas nao estao cadastradas no quadro do time
  const orfaos=useMemo(()=>
    Object.keys(carga).filter(n=>!resps.some(r=>r.toLowerCase()===n.toLowerCase()))
      .sort((a,b)=>a.localeCompare(b,'pt-BR'))
  ,[carga,resps]);

  const visiveis=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return q?resps.filter(r=>r.toLowerCase().includes(q)):resps;
  },[resps,search]);

  const cascadeRename=(antigo,novo)=>{
    if(!setTasks)return;
    setTasks(prev=>prev.map(t=>hasResp(t,antigo)?{...t,r:respJoin(respList(t.r).map(x=>x===antigo?novo:x))}:t));
  };
  const cascadeReassign=(nome,destino)=>{
    if(!setTasks)return;
    setTasks(prev=>prev.map(t=>hasResp(t,nome)?{...t,r:respJoin(respList(t.r).map(x=>x===nome?(destino||''):x))}:t));
  };

  const doAdd=async(nome)=>{
    const n=(nome!==undefined?nome:newName);
    const{error}=await add(n);
    if(error){setErr(error.message);return false;}
    setNewName('');setErr('');setFlash(n.trim()+' adicionado ao quadro.');
    return true;
  };

  const doBulk=async()=>{
    const nomes=[...new Set(bulk.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))];
    if(!nomes.length)return;
    setBusy(true);
    let ok=0,dup=0;
    for(const n of nomes){
      const{error}=await add(n);
      if(error)dup++;else ok++;
    }
    setBusy(false);setBulk('');setShowBulk(false);
    setFlash(ok+' adicionado(s)'+(dup?' · '+dup+' ignorado(s) (duplicado ou invalido)':''));
  };

  const commitEdit=async()=>{
    if(!editing)return;
    const alvo=editing.nome,n=editing.draft.trim();
    if(!n||n===alvo){setEditing(null);return;}
    const{error}=await rename(alvo,n);
    if(error){setEditing(e=>({...e,err:error.message}));return;}
    cascadeRename(alvo,n);
    setEditing(null);
    setFlash('Renomeado para '+n+'. '+((carga[alvo]&&carga[alvo].total)||0)+' tarefa(s) atualizada(s).');
  };

  const del=async()=>{
    const{nome,reassign}=confirmDel;
    const{error}=await remove(nome);
    if(error){setErr(error.message);setConfirmDel(null);return;}
    cascadeReassign(nome,reassign||'');
    setConfirmDel(null);
    const n=(carga[nome]&&carga[nome].total)||0;
    setFlash(nome+' removido.'+(n?' '+n+' tarefa(s) '+(reassign?'transferida(s) para '+reassign:'ficaram sem responsavel')+'.':''));
  };

  const doMove=async()=>{
    const{nome,destino,modo}=moving;
    if(!destino){setMoving(null);return;}
    setBusy(true);
    const{error}=await respsApi.add(nome,destino);
    if(error){setBusy(false);setErr(error.message);return;}
    if(modo==='mover'){
      const{error:e2}=await remove(nome);
      if(!e2)cascadeReassign(nome,'');
    }
    setBusy(false);setMoving(null);
    const tn=(teams.find(t=>String(t.id)===String(destino))||{}).nome||'outro time';
    setFlash(nome+(modo==='mover'?' movido para ':' copiado para ')+tn+'.');
  };

  const ist={background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt1)',fontSize:13,padding:'7px 11px',outline:'none',flex:1,boxSizing:'border-box'};
  const btnGhost={padding:'4px 9px',borderRadius:6,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:11,cursor:'pointer'};

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:14,width:'min(620px,100%)',maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 16px 56px rgba(0,0,0,.2)'}}>

        {/* Header */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexShrink:0}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:15,fontWeight:700,color:'var(--txt1)'}}>Responsáveis por time</div>
            <div style={{fontSize:11,color:'var(--txt3)',marginTop:2}}>
              {locked?'Selecione um time para editar':(teamNome?teamNome+' · ':'')+resps.length+' pessoa'+(resps.length!==1?'s':'')}
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {setTeamId&&teams.length>0&&
              <select value={teamId?String(teamId):''} onChange={e=>{setEditing(null);setConfirmDel(null);setMoving(null);setErr('');setTeamId(e.target.value?e.target.value:null);}}
                style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--bg2)',color:'var(--txt1)',fontSize:12,fontWeight:600,cursor:'pointer',outline:'none',maxWidth:190}}>
                <option value="">— Visão Geral (leitura) —</option>
                {teams.map(t=><option key={t.id} value={String(t.id)}>{t.nome}</option>)}
              </select>}
            <button onClick={onClose} style={{background:'none',border:'none',color:'var(--txt2)',fontSize:18,cursor:'pointer'}}>✕</button>
          </div>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:'16px 22px',display:'flex',flexDirection:'column',gap:14}}>

          {locked&&<div style={{padding:'9px 12px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,fontSize:11.5,color:'var(--txt2)',lineHeight:1.5}}>
            Cada time tem o seu próprio quadro de responsáveis. Escolha um time acima para adicionar, renomear ou remover pessoas.
          </div>}
          {error&&<div style={{padding:'9px 12px',background:'rgba(220,38,38,.08)',border:'1px solid rgba(220,38,38,.25)',borderRadius:8,fontSize:11.5,color:'#DC2626'}}>{error}</div>}
          {flash&&<div style={{padding:'9px 12px',background:'rgba(5,150,105,.08)',border:'1px solid rgba(5,150,105,.25)',borderRadius:8,fontSize:11.5,color:'#059669'}}>{flash}</div>}

          {/* Novo responsavel */}
          {!locked&&<div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8}}>Novo responsável</div>
              <button onClick={()=>setShowBulk(v=>!v)} style={{...btnGhost,padding:'3px 8px'}}>{showBulk?'Cadastro simples':'Cadastro em lote'}</button>
            </div>
            {showBulk
              ?<div>
                 <textarea value={bulk} onChange={e=>setBulk(e.target.value)} rows={4}
                   placeholder={"Um nome por linha (ou separados por vírgula)\nEx:\nJoão Silva\nMaria Souza"}
                   style={{...ist,width:'100%',flex:'none',resize:'vertical',fontFamily:'inherit',lineHeight:1.5}}/>
                 <button onClick={doBulk} disabled={busy} style={{marginTop:7,padding:'7px 18px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:8,color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',opacity:busy?.6:1}}>
                   {busy?'Importando...':'Importar lista'}
                 </button>
               </div>
              :<div style={{display:'flex',gap:8}}>
                 <input ref={inputRef} value={newName} onChange={e=>{setNewName(e.target.value);setErr('');}}
                   placeholder="Ex: João Silva" style={ist}
                   onKeyDown={e=>{if(e.key==='Enter')doAdd();}}
                   onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
                 <button onClick={()=>doAdd()} style={{padding:'7px 18px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:8,color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>+ Adicionar</button>
               </div>}
            {err&&<div style={{fontSize:11,color:'#DC2626',marginTop:5}}>{err}</div>}
          </div>}

          {/* Lista */}
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8}}>Quadro do time</div>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar pessoa..."
                style={{...ist,padding:'5px 9px',fontSize:12,marginLeft:'auto',maxWidth:180}}/>
            </div>

            {loading&&<div style={{fontSize:12,color:'var(--txt3)',padding:'8px 0'}}>Carregando...</div>}
            {!loading&&visiveis.length===0&&
              <div style={{fontSize:12,color:'var(--txt3)',padding:'10px 0'}}>
                {resps.length?'Nenhuma pessoa corresponde à busca.':'Nenhum responsável cadastrado neste time ainda.'}
              </div>}

            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {visiveis.map(r=>{
                const isEd=editing&&editing.nome===r;
                const isDel=confirmDel&&confirmDel.nome===r;
                const isMv=moving&&moving.nome===r;
                const c=carga[r]||{total:0,ativas:0};
                const initials=r.split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
                const hue=(r.charCodeAt(0)*47)%360;
                return(
                  <div key={r} style={{padding:'10px 13px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:9}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <div style={{width:32,height:32,borderRadius:'50%',background:`hsl(${hue},40%,85%)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:`hsl(${hue},40%,30%)`,flexShrink:0}}>{initials}</div>

                      {isEd
                        ?<input autoFocus value={editing.draft} onChange={e=>setEditing(ed=>({...ed,draft:e.target.value,err:''}))}
                            onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditing(null);}}
                            style={{...ist,padding:'4px 9px',fontWeight:600}}/>
                        :<div style={{flex:1,minWidth:0}}>
                           <div style={{fontSize:13,fontWeight:600,color:'var(--txt1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r}</div>
                           <div style={{fontSize:10.5,color:'var(--txt3)',marginTop:1}}>
                             {c.total?c.ativas+' ativa'+(c.ativas!==1?'s':'')+' · '+c.total+' no total':'sem tarefas'}
                           </div>
                         </div>}

                      {isEd
                        ?<div style={{display:'flex',gap:5,flexShrink:0}}>
                           <button onClick={commitEdit} style={{padding:'4px 11px',borderRadius:6,background:'rgba(5,150,105,.1)',border:'1px solid rgba(5,150,105,.25)',color:'#059669',fontSize:11,fontWeight:700,cursor:'pointer'}}>Salvar</button>
                           <button onClick={()=>setEditing(null)} style={btnGhost}>Cancelar</button>
                         </div>
                        :(!isDel&&!isMv&&!locked)&&
                         <div style={{display:'flex',gap:5,flexShrink:0}}>
                           <button onClick={()=>setEditing({nome:r,draft:r,err:''})} style={{padding:'4px 9px',borderRadius:6,background:'rgba(180,83,9,.07)',border:'1px solid rgba(180,83,9,.2)',color:'#B45309',fontSize:11,cursor:'pointer'}}>Editar</button>
                           {teams.length>1&&<button onClick={()=>setMoving({nome:r,destino:'',modo:'copiar'})} style={{padding:'4px 9px',borderRadius:6,background:'rgba(8,145,178,.07)',border:'1px solid rgba(8,145,178,.2)',color:'#0891B2',fontSize:11,cursor:'pointer'}}>Time</button>}
                           <button onClick={()=>setConfirmDel({nome:r,reassign:''})} style={{padding:'4px 9px',borderRadius:6,background:'rgba(220,38,38,.07)',border:'1px solid rgba(220,38,38,.2)',color:'#DC2626',fontSize:11,cursor:'pointer'}}>Excluir</button>
                         </div>}
                    </div>

                    {isEd&&editing.err&&<div style={{fontSize:10.5,color:'#DC2626',marginTop:6}}>{editing.err}</div>}
                    {isEd&&c.total>0&&<div style={{fontSize:10.5,color:'var(--txt3)',marginTop:6}}>Ao salvar, as {c.total} tarefa(s) desta pessoa serão renomeadas automaticamente.</div>}

                    {/* Confirmacao de exclusao com reatribuicao */}
                    {isDel&&
                      <div style={{marginTop:10,paddingTop:10,borderTop:'1px dashed var(--border)'}}>
                        <div style={{fontSize:11.5,color:'#DC2626',fontWeight:600,marginBottom:7}}>
                          Excluir {r}?{c.total?` ${c.total} tarefa(s) estão atribuídas a esta pessoa.`:''}
                        </div>
                        {c.total>0&&
                          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                            <span style={{fontSize:11,color:'var(--txt2)',whiteSpace:'nowrap'}}>Transferir para:</span>
                            <select value={confirmDel.reassign} onChange={e=>setConfirmDel(d=>({...d,reassign:e.target.value}))}
                              style={{...ist,padding:'5px 9px',fontSize:12}}>
                              <option value="">— Deixar sem responsável —</option>
                              {resps.filter(x=>x!==r).map(x=><option key={x} value={x}>{x}</option>)}
                            </select>
                          </div>}
                        <div style={{display:'flex',gap:6}}>
                          <button onClick={del} style={{padding:'5px 14px',borderRadius:6,background:'#DC2626',border:'none',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer'}}>Confirmar exclusão</button>
                          <button onClick={()=>setConfirmDel(null)} style={btnGhost}>Cancelar</button>
                        </div>
                      </div>}

                    {/* Mover / copiar para outro time */}
                    {isMv&&
                      <div style={{marginTop:10,paddingTop:10,borderTop:'1px dashed var(--border)'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                          <select value={moving.modo} onChange={e=>setMoving(m=>({...m,modo:e.target.value}))}
                            style={{...ist,flex:'none',width:110,padding:'5px 9px',fontSize:12}}>
                            <option value="copiar">Copiar para</option>
                            <option value="mover">Mover para</option>
                          </select>
                          <select value={moving.destino} onChange={e=>setMoving(m=>({...m,destino:e.target.value}))}
                            style={{...ist,padding:'5px 9px',fontSize:12}}>
                            <option value="">— Escolha o time —</option>
                            {teams.filter(t=>String(t.id)!==String(teamId)).map(t=><option key={t.id} value={String(t.id)}>{t.nome}</option>)}
                          </select>
                        </div>
                        <div style={{fontSize:10.5,color:'var(--txt3)',marginBottom:8}}>
                          {moving.modo==='mover'
                            ?'Mover remove a pessoa deste time; as tarefas dela aqui ficam sem responsável.'
                            :'Copiar mantém a pessoa nos dois quadros. As tarefas não são alteradas.'}
                        </div>
                        <div style={{display:'flex',gap:6}}>
                          <button onClick={doMove} disabled={busy||!moving.destino} style={{padding:'5px 14px',borderRadius:6,background:'var(--accent)',border:'none',color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer',opacity:(busy||!moving.destino)?.5:1}}>Confirmar</button>
                          <button onClick={()=>setMoving(null)} style={btnGhost}>Cancelar</button>
                        </div>
                      </div>}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Orfaos: nomes usados em tarefas mas fora do quadro */}
          {!locked&&orfaos.length>0&&
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:7}}>Em tarefas, fora do quadro</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {orfaos.map(n=>(
                  <button key={n} onClick={()=>doAdd(n)} title="Clique para cadastrar no quadro deste time"
                    style={{padding:'4px 10px',borderRadius:99,background:'rgba(180,83,9,.07)',border:'1px dashed rgba(180,83,9,.35)',color:'#B45309',fontSize:11,cursor:'pointer'}}>
                    + {n} <span style={{opacity:.7}}>({carga[n].total})</span>
                  </button>
                ))}
              </div>
              <div style={{fontSize:10.5,color:'var(--txt3)',marginTop:6}}>Essas pessoas aparecem em tarefas mas não estão cadastradas. Clique para incluir no quadro.</div>
            </div>}
        </div>

        <div style={{padding:'12px 22px',borderTop:'1px solid var(--border)',flexShrink:0,background:'var(--bg2)',borderRadius:'0 0 14px 14px',display:'flex',gap:8,alignItems:'center'}}>
          <button onClick={onClose} style={{padding:'8px 22px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>Fechar</button>
          {reload&&<button onClick={reload} style={{...btnGhost,padding:'7px 14px',fontSize:12}}>Recarregar</button>}
          <span style={{marginLeft:'auto',fontSize:10.5,color:'var(--txt3)'}}>Renomear e excluir refletem nas tarefas do time.</span>
        </div>
      </div>
    </div>
  );
}

/* ── Kanban do backlog ────────────────────────────────────────────────
   Vive fora do ciclo da iniciativa: a coluna e uma propriedade da
   tarefa, entao dá para acumular trabalho aqui enquanto a iniciativa
   segue rodando no board. */
function BacklogKanban({tasks,backlog={},setBacklog,setTasks,openEdit,tipos={},parents={},iStatus={},allG=[],onAddBacklogTask,trocaModo}){
  const[busca,setBusca]=useState('');
  const[fIni,setFIni]=useState('');
  const[drag,setDrag]=useState(null);
  const[sobre,setSobre]=useState(null);
  const[addCol,setAddCol]=useState(null);
  const[novo,setNovo]=useState('');
  const[novaIni,setNovaIni]=useState(allG[0]||'Backlog Geral');
  const canEdit=Boolean(setBacklog);

  const itens=useMemo(()=>{
    const q=busca.trim().toLowerCase();
    return tasks.filter(t=>{
      if(!bkCol(backlog,t))return false;
      if(fIni&&t.g!==fIni)return false;
      if(q&&!((t.t||'')+' '+(t.c||'')+' '+(t.r||'')+' '+(t.g||'')).toLowerCase().includes(q))return false;
      return true;
    });
  },[tasks,backlog,busca,fIni]);

  const porColuna=useMemo(()=>{
    const m={};BK_COLS.forEach(c=>{m[c.id]=[];});
    itens.forEach(t=>{const c=bkCol(backlog,t);if(m[c])m[c].push(t);else m[BK_COLS[0].id].push(t);});
    Object.keys(m).forEach(k=>m[k].sort((a,b)=>tn(a.t)-tn(b.t)));
    return m;
  },[itens,backlog]);

  const mover=(id,col)=>{if(setBacklog)setBacklog(prev=>({...prev,[id]:col}));};
  const tirar=t=>{
    if(!setBacklog)return;
    setBacklog(prev=>({...prev,[t.id]:''}));
    if(setTasks&&BK_AUTO.includes(t.s))setTasks(prev=>prev.map(x=>x.id===t.id?{...x,s:'Em andamento'}:x));
  };
  const passo=(t,dir)=>{
    const i=BK_COLS.findIndex(c=>c.id===bkCol(backlog,t));
    const j=i+dir;
    if(j<0||j>=BK_COLS.length)return;
    mover(t.id,BK_COLS[j].id);
  };
  const criar=col=>{
    const v=novo.trim();
    if(!v||!onAddBacklogTask)return;
    onAddBacklogTask((novaIni||'Backlog Geral').trim(),v,col);
    setNovo('');
  };

  const inis=[...new Set([...allG,'Backlog Geral'])].sort((a,b)=>a.localeCompare(b,'pt-BR'));

  return(
    <div>
      <div style={{padding:'14px 24px 12px',borderBottom:'1px solid var(--border)',background:'var(--bg1)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        {trocaModo}
        <span style={{fontSize:13,fontWeight:700,color:'var(--txt1)'}}>Backlog</span>
        <span style={{fontSize:11,color:'var(--txt3)',background:'var(--bg2)',border:'1px solid var(--border)',padding:'1px 9px',borderRadius:99}}>{itens.length} tarefa{itens.length!==1?'s':''}</span>
        <span style={{fontSize:11,color:'var(--txt3)'}}>independente do status da iniciativa</span>
        <div style={{display:'flex',gap:8,marginLeft:'auto',flexWrap:'wrap'}}>
          <select value={fIni} onChange={e=>setFIni(e.target.value)} style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--bg)',color:'var(--txt1)',fontSize:12,cursor:'pointer',outline:'none',maxWidth:220}}>
            <option value="">Todas as iniciativas</option>
            {[...new Set(tasks.filter(t=>bkCol(backlog,t)).map(t=>t.g))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(g=><option key={g} value={g}>{g}</option>)}
          </select>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar no backlog..." style={{padding:'6px 11px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt1)',fontSize:12.5,outline:'none',minWidth:190}}/>
        </div>
      </div>

      {canEdit&&onAddBacklogTask&&
        <div style={{padding:'10px 24px',borderBottom:'1px solid var(--border)',background:'var(--bg2)',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8}}>Nova tarefa em</span>
          <select value={novaIni} onChange={e=>setNovaIni(e.target.value)} style={{padding:'6px 10px',borderRadius:8,border:'1px solid var(--border)',background:'var(--bg1)',color:'var(--txt1)',fontSize:12,cursor:'pointer',outline:'none',maxWidth:260}}>
            {inis.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
          <span style={{fontSize:11,color:'var(--txt3)'}}>use “Backlog Geral” para o que ainda não tem iniciativa definida</span>

      <div style={{padding:'16px 24px 48px',display:'flex',gap:14,overflowX:'auto',alignItems:'flex-start'}}>
