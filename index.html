/* Painel de subtarefas do item pai: lista, status individual,
   renomear no proprio lugar e campo para digitar uma nova. */
function SubtaskPanel({pai,tasks,parents,setTasks,onAdd,canEdit=true,compact=false}){
  const[novo,setNovo]=useState('');
  const[edit,setEdit]=useState(null);
  const subs=childrenOf(tasks,parents,pai.id).sort((a,b)=>tn(a.t)-tn(b.t));
  const upd=(id,patch)=>setTasks&&setTasks(prev=>prev.map(t=>t.id===id?{...t,...patch}:t));
  const commit=()=>{
    if(!edit)return;
    const v=edit.draft.trim();
    if(v&&v!==edit.orig)upd(edit.id,{t:v});
    setEdit(null);
  };
  const add=()=>{
    const v=novo.trim();
    if(!v||!onAdd)return;
    onAdd(pai,v);setNovo('');
  };
  const done=subs.filter(t=>DONE.includes(t.s)).length;
  return(
    <div onClick={e=>e.stopPropagation()}>
      {!compact&&<div style={{fontSize:9,fontWeight:700,color:'var(--txt2)',textTransform:'uppercase',letterSpacing:1.2,marginBottom:7,display:'flex',alignItems:'center',gap:5}}>
        <span style={{width:2,height:10,background:'var(--accent)',borderRadius:2,display:'inline-block'}}/>
        Subtarefas
        {subs.length>0&&<span style={{fontWeight:600,letterSpacing:0,textTransform:'none',color:'var(--txt3)'}}>({done}/{subs.length} concluidas)</span>}
      </div>}
      {subs.length===0
        ?<div style={{fontSize:11,color:'var(--txt3)',marginBottom:6}}>Nenhuma subtarefa.</div>
        :<div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:7,maxHeight:compact?200:230,overflowY:subs.length>7?'auto':'visible',paddingRight:subs.length>7?4:0}}>
           {subs.map(st=>(
             <div key={st.id} style={{display:'flex',alignItems:'center',gap:7}}>
               <span style={{color:'var(--txt3)',fontFamily:'monospace',fontSize:11,flexShrink:0}}>&#8627;</span>
               {edit&&edit.id===st.id
                 ?<input autoFocus value={edit.draft} onChange={e=>setEdit(x=>({...x,draft:e.target.value}))} onBlur={commit}
                    onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape')setEdit(null);}}
                    style={{flex:1,minWidth:0,fontSize:11.5,padding:'3px 7px',borderRadius:6,border:'1px solid var(--accent)',background:'var(--bg1)',color:'var(--txt1)',outline:'none'}}/>
                 :<span onClick={()=>canEdit&&setEdit({id:st.id,draft:st.t,orig:st.t})} title={canEdit?'Clique para renomear':st.t}
                    style={{flex:1,minWidth:0,fontSize:11.5,color:'var(--txt1)',cursor:canEdit?'text':'default',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:DONE.includes(st.s)?'line-through':'none',opacity:DONE.includes(st.s)?.65:1}}>{st.t}</span>}
               <SubStatusSelect value={st.s} disabled={!canEdit} onChange={v=>upd(st.id,{s:v})}/>
             </div>
           ))}
         </div>}
      {canEdit&&onAdd&&
        <div style={{display:'flex',gap:6}}>
          <input value={novo} onChange={e=>setNovo(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}
            placeholder="Digite uma subtarefa e tecle Enter"
            style={{flex:1,minWidth:0,fontSize:11.5,padding:'5px 9px',borderRadius:7,border:'1px dashed var(--border2)',background:'var(--bg1)',color:'var(--txt1)',outline:'none'}}
            onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border2)'}/>
          <button onClick={add} disabled={!novo.trim()} style={{padding:'4px 12px',borderRadius:7,border:'none',background:novo.trim()?'var(--accent)':'var(--bg2)',color:novo.trim()?'#fff':'var(--txt3)',fontSize:11.5,fontWeight:700,cursor:novo.trim()?'pointer':'default'}}>Adicionar</button>

/* ══════════════════════════════════════════════════════════════
   SUBTAREFAS
   O vinculo filho->pai vive no mapa `parents` ({idFilho:idPai}),
   persistido em pm_data — mesmo padrao ja usado por `tipos`.
   ══════════════════════════════════════════════════════════════ */
function parentOf(parents,id){
  const p=parents?parents[id]:null;
  if(p===null||p===undefined||p==='')return null;
  const n=Number(p);
  return isNaN(n)?null:n;
}
const isSub=(parents,id)=>parentOf(parents,id)!==null;
const childrenOf=(list,parents,id)=>list.filter(t=>parentOf(parents,t.id)===Number(id));
// Ordena a lista mantendo cada subtarefa logo abaixo da sua tarefa pai.
// Devolve copias com `_depth` (0 = raiz, 1+ = subtarefa).
function hierarchize(list,parents,cmp){
  const ids=new Set(list.map(t=>t.id));
  const kids={};
  const roots=[];
  list.forEach(t=>{
    const p=parentOf(parents,t.id);
    if(p!==null&&ids.has(p))(kids[p]=kids[p]||[]).push(t);
    else roots.push(t);
  });
  const out=[];
  const seen=new Set();
  const walk=(t,depth)=>{
    if(seen.has(t.id))return;           // guarda contra ciclos
    seen.add(t.id);
    out.push({...t,_depth:depth});
    (kids[t.id]||[]).slice().sort(cmp).forEach(c=>walk(c,depth+1));
  };
  roots.slice().sort(cmp).forEach(t=>walk(t,0));
  list.forEach(t=>{if(!seen.has(t.id))out.push({...t,_depth:0});});
  return out;
}

function parseDate(s){if(!s||!s.includes('/'))return null;const[d,m]=s.split('/').map(Number);if(!d||!m)return null;return new Date(2026,m-1,d);}
function weekStart(d){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()-day+(day===0?-6:1));x.setHours(0,0,0,0);return x;}
function fmtDate(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function detectPhase(text){const t=text.toLowerCase();if(/\[.+\]/.test(text))return'CUSTOM';if(t.includes('prd'))return'PRD';if(t.includes('q.a'))return'QA';if(t.includes('stg'))return'STG';if(t.includes('liberado mr')||t.includes('mr validado'))return'MR';if(t.includes('bloqueado'))return'BLOCKED';return'DEV';}
function extractCustomLabel(text){const m=text.match(/\[([^\]]+)\]/);return m?m[1]:null;}
function getTaskDayMap(task){
  const map={};
  // Read acompanhamento (Board) — read-only in timeline
  if(task.a){task.a.split('\n').forEach(line=>{const m=line.match(/^(\d{1,2}\/\d{1,2})/);if(!m)return;const date=parseDate(m[1]);if(!date)return;const dk=date.toISOString().slice(0,10);const ph=detectPhase(line);const cl=ph==='CUSTOM'?extractCustomLabel(line):null;const ex=map[dk];if(!ex||PH[ph].pr>PH[ex.ph].pr){map[dk]={ph,cl,lines:[line],src:'board'};}else if(ex.ph===ph){ex.lines.push(line);}});}
  // Read plan (Timeline-only) — overrides board for same day
  if(task.plan){task.plan.split('\n').forEach(line=>{const m=line.match(/^(\d{1,2}\/\d{1,2})/);if(!m)return;const date=parseDate(m[1]);if(!date)return;const dk=date.toISOString().slice(0,10);const ph=detectPhase(line);const cl=ph==='CUSTOM'?extractCustomLabel(line):null;map[dk]={ph,cl,lines:[line],src:'plan'};});}
  return map;
}
function sortLog(lines){return[...lines].sort((a,b)=>{const p=s=>{const m=s.match(/^(\d{1,2})\/(\d{1,2})/);return m?(+m[2])*100+(+m[1]):0;};return p(b)-p(a);});}

function exportXLSX(tasks,parents={},tipos={}){
  if(!window.XLSX){alert('XLSX nao disponivel');return;}
  const wb=window.XLSX.utils.book_new();

  // ── Aba 1: Todas as Tarefas (unica aba) ──────────────────
  const taskRows=tasks
    .sort((a,b)=>{
      const ga=[...new Set(tasks.map(t=>t.g))].indexOf(a.g);
      const gb=[...new Set(tasks.map(t=>t.g))].indexOf(b.g);
      return ga!==gb?ga-gb:tn(a.t)-tn(b.t);
    })
    .map(t=>({
      'Iniciativa':t.g,
      'Card':t.c,
      'Tarefa':t.t,
      'Status':t.s,
      'Tipo':tipos[t.id]||'Tarefa',
      'Tarefa pai':(()=>{const p=parentOf(parents,t.id);const pt=p!==null?tasks.find(x=>x.id===p):null;return pt?pt.t:'';})(),
      'Responsaveis':respList(t.r).join(' | '),
      'Versao':t.v,
      'Acompanhamento':t.a,
      'Link MR':t.mr,
    }));
  const wsTasks=window.XLSX.utils.json_to_sheet(taskRows);
  wsTasks['!cols']=[{wch:30},{wch:12},{wch:60},{wch:20},{wch:10},{wch:40},{wch:26},{wch:12},{wch:60},{wch:50}];
  window.XLSX.utils.book_append_sheet(wb,wsTasks,'Tarefas');

  // ── Aba 2: Linha do Tempo ─────────────────────────────────
  // Gera todas as datas encontradas no acompanhamento e monta uma linha por tarefa x data
  const timeRows=[];
  tasks.forEach(t=>{
    if(!t.a)return;
    t.a.split('\n').filter(Boolean).forEach(line=>{
      const m=line.match(/^(\d{1,2}\/\d{1,2})/);
      if(!m)return;
      const dateStr=m[1];
      const desc=line.slice(dateStr.length).replace(/^\s*[-\u2014]\s*/,'');
      const ph=detectPhase(line);
      const phLabels={DEV:'Desenvolvimento',MR:'Merge Request',STG:'STG / Homologacao',QA:'Q.A',PRD:'Deploy PRD',BLOCKED:'Bloqueado'};
      timeRows.push({
        'Data':dateStr,
        'Iniciativa':t.g,
        'Card':t.c,
        'Tarefa':t.t,
        'Fase':phLabels[ph]||ph,
        'Responsaveis':respList(t.r).join(' | '),
        'Status Atual':t.s,
        'Descricao':desc,
      });
    });
  });
  // Ordena por data (MM*100+DD) depois por iniciativa
  timeRows.sort((a,b)=>{
    const toN=s=>{const p=s.match(/^(\d{1,2})\/(\d{1,2})/);return p?(+p[2])*100+(+p[1]):0;};
    return toN(a.Data)-toN(b.Data)||a.Iniciativa.localeCompare(b.Iniciativa,'pt-BR');
  });
  const wsTime=window.XLSX.utils.json_to_sheet(timeRows);
  wsTime['!cols']=[{wch:8},{wch:28},{wch:12},{wch:55},{wch:20},{wch:14},{wch:20},{wch:55}];
  window.XLSX.utils.book_append_sheet(wb,wsTime,'Linha do Tempo');

  window.XLSX.writeFile(wb,'planeja-merchant.xlsx');
}

function Drawer({open,onClose,onSave,grupos,allResp,editing,tipos={},parents={},tasks=[]}){
  const preGroup=editing&&editing._preGroup?editing._preGroup:null;
  const preParent=editing&&editing._preParent!=null?String(editing._preParent):'';
  const isEdit=Boolean(editing)&&!preGroup;
  const blank=()=>({t:'',c:'',v:'',s:'Nao Iniciado',r:'',g:preGroup||'',ng:'',tipo:'Tarefa',parent:preParent});
  const[form,setForm]=useState(blank());
  const[gmode,setGmode]=useState('ex');
  const[mrList,setMrList]=useState(['']);
  const[hist,setHist]=useState('');
  const[entry,setEntry]=useState('');
  const[errs,setErrs]=useState({});
  const[tab,setTab]=useState('d');
  const ref=useRef(null);
  const today=()=>new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

  useEffect(()=>{
    if(!open)return;
    setErrs({});setTab('d');
    if(preGroup){
      setForm({t:'',c:'',v:'',s:'Nao Iniciado',r:'',g:preGroup,ng:'',tipo:'Tarefa',parent:preParent});
      setGmode('ex');setMrList(['']);setHist('');setEntry('');
    }else if(isEdit){
      const pai=parentOf(parents,editing.id);
      setForm({t:editing.t,c:editing.c,v:editing.v,s:editing.s,r:editing.r,g:editing.g,ng:'',tipo:tipos[editing.id]||'Tarefa',parent:pai!==null?String(pai):''});
      setGmode('ex');setMrList(editing.mr?editing.mr.split('\n').filter(Boolean):['']);
      setHist(editing.a||'');setEntry('');
    }else{setForm(blank());setGmode('ex');setMrList(['']);setHist('');setEntry('');}
    setTimeout(()=>ref.current&&ref.current.focus(),80);
  },[open,editing]);

  useEffect(()=>{
    const fn=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);
  },[onClose]);

  const set=(k,v)=>{setForm(f=>({...f,[k]:v}));setErrs(e=>({...e,[k]:undefined}));};
  // ── responsaveis multiplos ──
  const selResp=respList(form.r);
  const toggleResp=n=>set('r',respJoin(selResp.indexOf(n)>=0?selResp.filter(x=>x!==n):[...selResp,n]));
  // ── subtarefas ──
  const gAtual=gmode==='new'?form.ng.trim():form.g;
  const temFilhos=isEdit&&tasks.some(t=>parentOf(parents,t.id)===editing.id);
  const paiOpcoes=useMemo(()=>tasks
      .filter(t=>(!isEdit||t.id!==editing.id)&&(!gAtual||t.g===gAtual)&&parentOf(parents,t.id)===null)
      .sort((a,b)=>tn(a.t)-tn(b.t)),[tasks,gAtual,isEdit,editing,parents]);
  const addMr=()=>setMrList(l=>[...l,'']);
  const setMr=(i,v)=>setMrList(l=>l.map((x,j)=>j===i?v:x));
  const rmMr=i=>setMrList(l=>l.filter((_,j)=>j!==i));

  const validate=()=>{
    const e={};
    if(!form.t.trim())e.t='Obrigatorio';
    if(!form.s)e.s='Obrigatorio';
    if(!form.parent){                       // subtarefa herda a iniciativa do pai
      if(gmode==='ex'&&!form.g)e.g='Selecione';
      if(gmode==='new'&&!form.ng.trim())e.ng='Nome obrigatorio';
    }
    return e;
  };

  const save=()=>{
    const e=validate();if(Object.keys(e).length){setErrs(e);return;}
    let gFinal=gmode==='new'?form.ng.trim():form.g;
    const pai=form.parent?tasks.find(t=>String(t.id)===String(form.parent)):null;
    if(pai)gFinal=pai.g;                    // subtarefa sempre na iniciativa do pai
    const mrFinal=mrList.filter(Boolean).join('\n');
    let aFinal;
    if(isEdit){
      const el=entry.trim();
      const line=el?(el.includes('-')?el:`${today()} - ${el}`):'';
      const base=hist.trim();
      aFinal=line?(line+(base?'\n'+base:'')):base;
    }else{
      const el=entry.trim()||hist.trim();
      aFinal=el&&!el.includes('-')?`${today()} - ${el}`:el;
    }
    onSave({...form,g:gFinal,mr:mrFinal,a:aFinal,parent:pai?pai.id:null},isEdit?editing.id:null);
    onClose();
  };

                    :(allResp||[]).map(r=>{

                    ?'Esta tarefa ja possui subtarefas, por isso nao pode virar subtarefa de outra.'

                </div>
              </div>
            </React.Fragment>
          )}
          {tab==='l'&&(
            <React.Fragment>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>{isEdit?'Nova entrada (ao topo)':'Registro inicial'}</div>
                <div style={{fontSize:10,color:'var(--txt3)',marginBottom:6}}>Formato: DD/MM - descricao</div>
                <textarea value={entry} onChange={e=>setEntry(e.target.value)} placeholder={today()+' - Inicio do desenvolvimento'} rows={3} style={{...ist,resize:'vertical',fontFamily:'inherit'}} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
              {isEdit&&(
                <div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8}}>Historico</span>
                    <span style={{fontSize:10,color:'var(--txt3)'}}>{hLines.length} entradas</span>
                  </div>
                  {hLines.length>0?<React.Fragment>
                    <div style={{background:'#F7F9FC',borderRadius:8,border:'1px solid var(--border)',padding:'10px 12px',marginBottom:8,maxHeight:160,overflowY:'auto'}}>
                      {sortLog(hLines).map((line,i)=>{const[d,...r]=line.split(' - ');return <div key={i} style={{display:'flex',gap:8,paddingBottom:5,marginBottom:5,borderBottom:i<hLines.length-1?'1px solid var(--border)':'none'}}><span style={{fontFamily:'monospace',fontSize:10,color:'var(--cyan)',opacity:.7,minWidth:38,flexShrink:0}}>{d}</span><span style={{fontSize:11,color:'var(--txt2)'}}>{r.join(' - ')}</span></div>;})}
                    </div>
                    <textarea value={hist} onChange={e=>setHist(e.target.value)} rows={4} style={{...ist,fontFamily:'monospace',fontSize:11,lineHeight:1.8,resize:'vertical'}} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
                  </React.Fragment>
                  :<div style={{padding:14,textAlign:'center',color:'var(--txt3)',fontSize:11,background:'var(--bg)',borderRadius:8,border:'1px dashed var(--border)'}}>Sem historico.</div>}
                </div>
              )}
            </React.Fragment>
          )}
          {tab==='m'&&(
            <React.Fragment>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>Links de Merge Request</div>
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {mrList.map((link,i)=>(
                  <div key={i} style={{display:'flex',gap:6,alignItems:'center'}}>
                    <span style={{fontSize:10,color:'var(--txt3)',fontFamily:'monospace',minWidth:16}}>#{i+1}</span>

                    {mrList.length>1&&<button onClick={()=>rmMr(i)} style={{background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',color:'#F87171',borderRadius:6,cursor:'pointer',padding:'0 9px',height:36,fontSize:13}}>x</button>}
                  </div>
                ))}
                <button onClick={addMr} style={{alignSelf:'flex-start',padding:'5px 12px',background:'transparent',border:'1px dashed var(--border)',borderRadius:6,color:'var(--txt3)',fontSize:11,cursor:'pointer'}}>+ Adicionar MR</button>
              </div>
            </React.Fragment>
          )}
        </div>
        <div style={{padding:'14px 22px',borderTop:'1px solid var(--border)',display:'flex',gap:9,flexShrink:0}}>
          <button onClick={onClose} style={{flex:1,padding:'9px 0',borderRadius:8,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:13,fontWeight:600,cursor:'pointer'}}>Cancelar</button>
          <button onClick={save} style={{flex:2,padding:'9px 0',borderRadius:8,background:isEdit?'linear-gradient(135deg,#92400E,#FBBF24)':'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            {isEdit?'Salvar alteracoes':'Criar tarefa'}
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function BoardView({tasks,setTasks,openCreate,openEdit,iStatus={},setIStatus,openBulkCreate,statusProduto=[],tipos={},resps=[],parents={},openCreateSub,allTasks=null,onAddSub}){
  const[search,setSearch]=useState('');
  const[fStatus,setFStatus]=useState([]);
  const[fResp,setFResp]=useState([]);
  const[sortCol,setSortCol]=useState(null);
  const[sortDir,setSortDir]=useState(null);
  const[expanded,setExpanded]=useState(new Set());
  const[groupBy,setGroupBy]=useState(true);
  const[showSubs,setShowSubs]=useState(false);   // subtarefas ficam no painel do pai, nao na lista
  const[fGrupo,setFGrupo]=useState([]);
  const[selected,setSelected]=useState(new Set());
  const[bulkModal,setBulkModal]=useState(false);
  const[collapsedGroups,setCollapsedGroups]=useState(new Set());
  const toggleGroupCollapse=g=>setCollapsedGroups(prev=>{const s=new Set(prev);s.has(g)?s.delete(g):s.add(g);return s;});
  const[editGrupo,setEditGrupo]=useState(null);
  const[confDel,setConfDel]=useState(null);
  const grupoRef=useRef(null);

  const allResp=useMemo(()=>allRespOf(tasks),[tasks]);
  const allStatus=useMemo(()=>[...new Set(tasks.map(t=>t.s))].sort((a,b)=>a.localeCompare(b,'pt-BR')),[tasks]);

  const toggleSort=col=>{if(sortCol!==col){setSortCol(col);setSortDir('asc');}else{const n=SCY[sortDir];if(!n){setSortCol(null);setSortDir(null);}else setSortDir(n);}};
  const toggleF=(arr,setArr,val)=>setArr(prev=>prev.includes(val)?prev.filter(v=>v!==val):[...prev,val]);
  const toggleRow=id=>setExpanded(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const toggleSel=id=>setSelected(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const selAll=ids=>{const all=ids.every(id=>selected.has(id));setSelected(prev=>{const s=new Set(prev);all?ids.forEach(id=>s.delete(id)):ids.forEach(id=>s.add(id));return s;});};
  const clearSel=()=>setSelected(new Set());

  const startRename=g=>setEditGrupo({orig:g,draft:g});
  const commitRename=()=>{
    if(!editGrupo)return;
    const{orig,draft}=editGrupo;
    if(draft.trim()&&draft.trim()!==orig)setTasks(prev=>prev.map(t=>t.g===orig?{...t,g:draft.trim()}:t));
    setEditGrupo(null);
  };
  // Excluir uma tarefa pai remove tambem as subtarefas dela (em cascata)
  const descendants=id=>{
    const kill=new Set([id]);let mudou=true;
    while(mudou){mudou=false;tasks.forEach(t=>{const p=parentOf(parents,t.id);if(p!==null&&kill.has(p)&&!kill.has(t.id)){kill.add(t.id);mudou=true;}});}
    return kill;
  };
  const deleteTask=id=>{const kill=descendants(id);setTasks(prev=>prev.filter(t=>!kill.has(t.id)));setConfDel(null);};
  const deleteGroup=name=>{setTasks(prev=>prev.filter(t=>t.g!==name));setConfDel(null);};

  useEffect(()=>{if(editGrupo)grupoRef.current&&grupoRef.current.focus();},[editGrupo]);
  useEffect(()=>{const fn=e=>{if(e.key==='Escape'){setEditGrupo(null);setConfDel(null);}};window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);},[]);

  const filtered=useMemo(()=>{
    let list=[...tasks];
    if(search){const q=search.toLowerCase();list=list.filter(t=>t.t.toLowerCase().includes(q)||t.c.toLowerCase().includes(q)||String(t.r||'').toLowerCase().includes(q)||t.g.toLowerCase().includes(q));}
    if(fStatus.length)list=list.filter(t=>fStatus.includes(t.s));
    if(fResp.length)list=list.filter(t=>fResp.some(r=>hasResp(t,r)));
    if(fGrupo.length)list=list.filter(t=>fGrupo.includes(t.g));
    if(sortCol&&sortDir)list.sort((a,b)=>{const va=a[sortCol]||'',vb=b[sortCol]||'';return sortDir==='asc'?va.localeCompare(vb,'pt-BR'):-va.localeCompare(vb,'pt-BR');});
    return list;
  },[tasks,search,fStatus,fResp,fGrupo,sortCol,sortDir]);

  const cmpTn=(a,b)=>tn(a.t)-tn(b.t);
  const filtrando=Boolean(search||fStatus.length||fResp.length||fGrupo.length);
  const mostrarSubs=showSubs||filtrando;   // filtro ativo revela as subtarefas que casam
  const semSubs=list=>mostrarSubs?list:list.filter(t=>(t._depth||0)===0);
  const grouped=useMemo(()=>{
    if(!groupBy)return{'Todas as Tarefas':semSubs(hierarchize(filtered,parents,cmpTn))};
    const grp={};
    filtered.forEach(t=>{(grp[t.g]=grp[t.g]||[]).push(t);});
    Object.keys(grp).forEach(g=>{grp[g]=semSubs(hierarchize(grp[g],parents,cmpTn));});
    const keys=Object.keys(grp).sort((a,b)=>{
      const ma=Math.min(...grp[a].map(t=>tn(t.t)));
      const mb=Math.min(...grp[b].map(t=>tn(t.t)));
      return ma-mb;
    });
    const ord={};keys.forEach(k=>{ord[k]=grp[k];});return ord;
  },[filtered,groupBy,parents,mostrarSubs]);

  const BulkEditModal=()=>{
    const[bStatus,setBStatus]=useState('');
    const[bResp,setBResp]=useState('');
    const[bRespMode,setBRespMode]=useState('set');
    const[bGrupo,setBGrupo]=useState('');
    const[bConfDel,setBConfDel]=useState(false);
    const allResp2=[...resps].sort((a,b)=>a.localeCompare(b,'pt-BR')); // apenas o time ativo
    const allG2=[...new Set(tasks.map(t=>t.g))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const ist={width:'100%',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,color:'var(--txt1)',fontSize:13,padding:'7px 10px',outline:'none'};
    const applyBulk=()=>{
      setTasks(prev=>prev.map(t=>{
        if(!selected.has(t.id))return t;
        let r=t.r;
        if(bResp){
          const atual=respList(t.r);
          if(bResp===' ')r='';
          else if(bRespMode==='add')r=respJoin([...atual,bResp]);
          else if(bRespMode==='rm')r=respJoin(atual.filter(x=>x!==bResp));
          else r=bResp;
        }
        return{...t,...(bStatus?{s:bStatus}:{}),...(bResp?{r}:{}),...(bGrupo?{g:bGrupo}:{})};
      }));
      setBulkModal(false);clearSel();
    };
    const deleteBulk=()=>{setTasks(prev=>prev.filter(t=>!selected.has(t.id)));setBulkModal(false);clearSel();};
    return(
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:150,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,width:'min(460px,100%)',boxShadow:'0 12px 48px rgba(0,0,0,.15)'}}>
          <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:'var(--txt1)'}}>Editar em lote</div>
              <div style={{fontSize:11,color:'var(--txt3)',marginTop:2}}>{selected.size} tarefa{selected.size!==1?'s':''} selecionada{selected.size!==1?'s':''} — preencha apenas o que deseja alterar</div>
            </div>
            <button onClick={()=>setBulkModal(false)} style={{background:'none',border:'none',color:'var(--txt3)',fontSize:18,cursor:'pointer'}}>✕</button>
          </div>
          <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:14}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>Status</div>
              <select value={bStatus} onChange={e=>setBStatus(e.target.value)} style={ist}>
                <option value="">Manter atual</option>
                {Object.keys(SC).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>Responsaveis</div>
              <div style={{display:'flex',gap:6,marginBottom:6}}>
                {[['set','Substituir'],['add','Adicionar'],['rm','Remover']].map(([m,lbl])=>(
                  <button key={m} type="button" onClick={()=>setBRespMode(m)} style={{flex:1,padding:'5px 0',borderRadius:7,fontSize:11,fontWeight:600,cursor:'pointer',border:'1px solid '+(bRespMode===m?'rgba(79,70,229,.4)':'var(--border)'),background:bRespMode===m?'rgba(79,70,229,.1)':'transparent',color:bRespMode===m?'var(--accent)':'var(--txt2)'}}>{lbl}</button>
                ))}
              </div>
              <select value={bResp} onChange={e=>setBResp(e.target.value)} style={ist}>
                <option value="">Manter atual</option>
                {allResp2.map(r=><option key={r} value={r}>{r}</option>)}
                <option value=" ">— Limpar todos os responsaveis —</option>
              </select>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>Iniciativa</div>
              <select value={bGrupo} onChange={e=>setBGrupo(e.target.value)} style={ist}>
                <option value="">Manter atual</option>
                {allG2.map(g=><option key={g} value={g}>{g}</option>)}
              </select>
            </div>
          </div>
          <div style={{padding:'14px 22px',borderTop:'1px solid var(--border)',display:'flex',gap:8,justifyContent:'space-between'}}>

        <button onClick={clearSel} style={{padding:'6px 12px',background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.2)',borderRadius:8,color:'#fff',fontSize:12,cursor:'pointer'}}>✕ Desmarcar</button>
      </div>
    )}
    {bulkModal&&<BulkEditModal/>}
    </React.Fragment>
  );
}

function Timeline({tasks,setTasks,iStatus={},setIStatus}){
  const[tooltip,setTooltip]=useState(null);
  const[cellEd,setCellEd]=useState(null);
  const[fGrupo,setFGrupo]=useState([]);
  const[collapsed,setCollapsed]=useState(new Set());
  const initRef=useRef(false);
  const scrollRef=useRef(null);
  const headerRef=useRef(null);
  const todayColRef=useRef(null);

  const{allDays,allWeeks,mSpans,grouped}=useMemo(()=>{
    const now=new Date();
    // Always show full 2026: Jan to Dec, plus ensure today is always visible
    let minD=new Date(2026,0,1);
    let maxD=new Date(2026,11,31); // Dec 31, 2026
    // Expand if tasks have entries beyond 2026
    tasks.forEach(t=>{if(!t.a)return;t.a.split('\n').forEach(line=>{const m=line.match(/^(\d{1,2}\/\d{1,2})/);if(!m)return;const d=parseDate(m[1]);if(!d)return;if(d<minD)minD=d;if(d>maxD)maxD=d;});});
    tasks.forEach(t=>{if(!t.plan)return;t.plan.split('\n').forEach(line=>{const m=line.match(/^(\d{1,2}\/\d{1,2})/);if(!m)return;const d=parseDate(m[1]);if(!d)return;if(d<minD)minD=d;if(d>maxD)maxD=d;});});
    tasks.forEach(t=>{if(!t.plan)return;t.plan.split('\n').forEach(line=>{const m=line.match(/^(\d{1,2}\/\d{1,2})/);if(!m)return;const d=parseDate(m[1]);if(!d)return;if(d<minD)minD=d;if(d>maxD)maxD=d;});});
    // Include today
    if(now<minD)minD=new Date(now.getFullYear(),now.getMonth(),1);
    const pStart=weekStart(new Date(minD.getTime()-7*86400000));
    const pEnd=new Date(Math.max(maxD.getTime(),now.getTime())+14*86400000);
    const days=[];let cur=new Date(pStart);
    while(cur<=pEnd){const dow=cur.getDay();if(dow>=1&&dow<=5)days.push(new Date(cur));cur=new Date(cur.getTime()+86400000);}
    const wkMap={},wkList=[];
    days.forEach(d=>{const wk=weekStart(d).toISOString().slice(0,10);if(!wkMap[wk]){wkMap[wk]={key:wk,days:[]};wkList.push(wkMap[wk]);}wkMap[wk].days.push(d);});
    wkList.forEach(w=>{const last=w.days[w.days.length-1];w.label=fmtDate(w.days[0])+' - '+fmtDate(last);});
    const ms=[];let curM=null,mDC=0,mSt=0;
    wkList.forEach((w,wi)=>{
      const mid=w.days[Math.floor(w.days.length/2)];
      const ml=mid.toLocaleDateString('pt-BR',{month:'long'}).replace(/^\w/,c=>c.toUpperCase())+' '+String(mid.getFullYear()).slice(2);
      if(ml!==curM){if(curM)ms.push({lb:curM,dc:mDC,wc:wi-mSt,si:mSt});curM=ml;mDC=0;mSt=wi;}
      mDC+=w.days.length;
    });
    if(curM)ms.push({lb:curM,dc:mDC,wc:wkList.length-mSt,si:mSt});
    const grp={};
    const grupos=[...new Set(tasks.map(t=>t.g))].sort((a,b)=>{const ta=tasks.find(x=>x.g===a),tb=tasks.find(x=>x.g===b);return (ta?tn(ta.t):0)-(tb?tn(tb.t):0);});
    grupos.forEach(g=>{grp[g]=tasks.filter(t=>t.g===g).sort((a,b)=>tn(a.t)-tn(b.t));});
    return{allDays:days,allWeeks:wkList,mSpans:ms,grouped:grp};
  },[tasks]);

  useEffect(()=>{
    if(initRef.current||mSpans.length===0)return;
    initRef.current=true;
    // Collapse all months except current
    const now=new Date();
    const curLabel=now.toLocaleDateString('pt-BR',{month:'long'}).replace(/^\w/,c=>c.toUpperCase())+' '+String(now.getFullYear()).slice(2);
    const last=mSpans[mSpans.length-1].lb;
    const keepOpen=mSpans.some(m=>m.lb===curLabel)?curLabel:last;
    setCollapsed(new Set(mSpans.map(m=>m.lb).filter(l=>l!==keepOpen)));
  },[mSpans]);

  // Scroll to today column after render
  useEffect(()=>{
    if(!scrollRef.current||!headerRef.current)return;
    // Use a small delay to ensure DOM is ready
    const timer=setTimeout(()=>{
      const container=scrollRef.current;
      const header=headerRef.current;
      if(!container||!header)return;
      // Find today's column by looking for the highlighted cell
      const todayCell=container.querySelector('[data-today="true"]')||headerRef.current.querySelector('[data-today="true"]');
      if(todayCell){
        const cellLeft=todayCell.offsetLeft;
        const offset=Math.max(0,cellLeft-(container.clientWidth/2));
        container.scrollLeft=offset;
        header.scrollLeft=offset;
      }
    },150);
    return()=>clearTimeout(timer);
  },[mSpans]);

  const toggleMonth=lb=>setCollapsed(prev=>{const n=new Set(prev);n.has(lb)?n.delete(lb):n.add(lb);return n;});

  const fGrp=fGrupo.length>0?Object.fromEntries(Object.entries(grouped).filter(([g])=>fGrupo.includes(g))):grouped;

  const DW=32,CW=28,NW=380,RH=34;

  const SBG='#FFFFFF';

  const saveCellDay=(taskId,days,ph,note)=>{
    setTasks(prev=>prev.map(t=>{
      if(t.id!==taskId)return t;
      // Write to task.plan — never touches task.a (Board acompanhamento)
      let lines=(t.plan||'').split('\n').filter(l=>{const m=l.match(/^(\d{1,2}\/\d{1,2})/);return !(m&&days.includes(m[1]));});
      const newLines=days.map(ds=>ds+' - '+note);
      return{...t,plan:[...newLines,...lines].filter(Boolean).join('\n')};
    }));
  };
  const delCellDay=(taskId,dk,src)=>{
    // NEVER modify task.a (Board acompanhamento) from the timeline
    if(src==='board')return;

          {Object.entries(PH).filter(([k])=>k!=='CUSTOM').map(([k,p])=><span key={k} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:10,color:p.col}}><span style={{width:10,height:10,borderRadius:2,background:p.sl}}/>{k==='DEV'?'Desenvolvedor':p.lb}</span>)}<span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:10,color:'#6366F1'}}><span style={{width:10,height:10,borderRadius:2,background:'rgba(99,102,241,.75)'}}/>Personalizada</span>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          {Object.keys(grouped).map(g=><Pill key={g} val={g.length>18?g.slice(0,18)+'...':g} active={fGrupo.includes(g)} onClick={()=>setFGrupo(prev=>prev.includes(g)?prev.filter(x=>x!==g):[...prev,g])}/>)}
          {fGrupo.length>0&&<button onClick={()=>setFGrupo([])} style={{fontSize:10,color:'#F87171',background:'none',border:'none',cursor:'pointer'}}>x</button>}
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 130px)',overflow:'hidden',borderTop:'1px solid var(--border)'}}>
        {/* ── Fixed header area (synced horizontally) ── */}
        <div ref={headerRef} style={{overflowX:'hidden',flexShrink:0,boxShadow:'0 2px 6px rgba(0,0,0,.07)',zIndex:20,position:'relative'}}>
          <div style={{display:'inline-block',minWidth:NW+totalCols+2}}>
          {/* Month row */}
          <div style={{display:'flex',background:SBG,borderBottom:'1px solid var(--border2)'}}>
            <div style={{width:NW,flexShrink:0,position:'sticky',left:0,zIndex:5,background:SBG,borderRight:'1px solid var(--border2)',borderBottom:'1px solid var(--border2)'}}/>
            {mSpans.map((ms,i)=>{
              const isC=collapsed.has(ms.lb);
              return <div key={i} onClick={()=>toggleMonth(ms.lb)} style={{width:isC?CW:ms.dc*DW,flexShrink:0,padding:isC?'2px 0':'5px 8px',background:'var(--bg2)',fontSize:isC?9:11,fontWeight:700,color:isC?'var(--txt3)':'var(--txt1)',textAlign:'center',borderBottom:'1px solid var(--border2)',borderLeft:'1px solid var(--border2)',overflow:'hidden',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {isC?<span style={{writingMode:'vertical-rl',fontSize:9,color:'var(--txt3)',transform:'rotate(180deg)',padding:'4px 0'}}>{'> '+ms.lb}</span>:<React.Fragment><span style={{fontSize:9,opacity:.5,marginRight:3}}>v</span>{ms.lb}</React.Fragment>}
              </div>;
            })}
          </div>
          {/* Week row */}
          <div style={{display:'flex',background:SBG}}>
            <div style={{width:NW,flexShrink:0,position:'sticky',left:0,zIndex:5,background:'#FFFFFF',borderRight:'1px solid var(--border2)',borderBottom:'1px solid var(--border)'}}/>
            {mSpans.map((ms,i)=>{
              if(collapsed.has(ms.lb))return <div key={i} style={{width:CW,flexShrink:0,borderLeft:'1px solid var(--border2)',borderBottom:'1px solid var(--border)',background:'var(--bg1)'}}/>;
              return allWeeks.slice(ms.si,ms.si+ms.wc).map((w,wi)=><div key={wi} style={{width:w.days.length*DW,flexShrink:0,padding:'3px 3px',background:'var(--bg1)',fontSize:8,fontWeight:600,color:'var(--txt3)',textAlign:'center',borderBottom:'1px solid var(--border)',borderLeft:'1px solid var(--border2)',overflow:'hidden',whiteSpace:'nowrap'}}>{w.label}</div>);
            })}
          </div>
          {/* Day row */}
          <div style={{display:'flex',background:SBG}}>
            <div style={{width:NW,flexShrink:0,position:'sticky',left:0,zIndex:5,padding:'3px 10px 3px 24px',fontSize:8,fontWeight:700,color:'var(--txt3)',background:SBG,borderRight:'1px solid var(--border2)',borderBottom:'1px solid var(--border)',letterSpacing:.5,textTransform:'uppercase',display:'flex',alignItems:'center'}}>Tarefa</div>
            {mSpans.map((ms,i)=>{
              if(collapsed.has(ms.lb))return <div key={i} style={{width:CW,flexShrink:0,borderLeft:'1px solid var(--border2)',borderBottom:'1px solid var(--border)',background:SBG}}/>;
              return allWeeks.slice(ms.si,ms.si+ms.wc).map((w,wi)=>(
                <React.Fragment key={wi}>{w.days.map(d=>{const dk=d.toISOString().slice(0,10);const isT=dk===todayK;const isM=d.getDay()===1;return <div key={dk} data-today={isT?"true":undefined} style={{width:DW,flexShrink:0,padding:'3px 1px',fontSize:8,fontWeight:isT?700:400,color:isT?'var(--cyan)':'var(--txt3)',textAlign:'center',background:isT?'rgba(34,211,238,.08)':SBG,borderBottom:'1px solid var(--border)',borderLeft:isM?'1px solid var(--border2)':'1px solid var(--border)',overflow:'hidden',whiteSpace:'nowrap'}}>{String(d.getDate()).padStart(2,'0')}/{String(d.getMonth()+1).padStart(2,'0')}</div>;})}</React.Fragment>

        <div ref={scrollRef} style={{flex:1,overflowX:'auto',overflowY:'auto'}}
          onScroll={e=>{if(headerRef.current)headerRef.current.scrollLeft=e.currentTarget.scrollLeft;}}>
          <div style={{display:'inline-block',minWidth:NW+totalCols+2}}>
          {/* Task rows */}
          {Object.entries(fGrp).map(([grupo,gtasks])=>(
            <React.Fragment key={grupo}>
              <div style={{display:'flex',alignItems:'stretch',marginTop:12,minHeight:28}}>
                <div style={{width:NW,flexShrink:0,position:'sticky',left:0,zIndex:10,padding:'0 8px 0 0',borderRight:'1px solid var(--border2)',background:'#FFFFFF',display:'flex',alignItems:'stretch',borderTop:`2px solid ${iStatus[grupo]?getISCfg(iStatus[grupo]).c:'var(--border2)'}`}}>
                  <div style={{width:4,background:iStatus[grupo]?getISCfg(iStatus[grupo]).c:'var(--border)',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0,padding:'5px 8px',display:'flex',flexDirection:'column',justifyContent:'center',gap:3}}>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--txt1)',lineHeight:1.4,wordBreak:'break-word',overflowWrap:'break-word'}}>{grupo}</span>
                    {setIStatus&&<select value={iStatus[grupo]||''} onChange={e=>setIStatus(prev=>({...prev,[grupo]:e.target.value}))} style={{alignSelf:'flex-start',fontSize:9,fontWeight:600,padding:'1px 7px 1px 4px',borderRadius:99,border:'1px solid '+(iStatus[grupo]?getISCfg(iStatus[grupo]).c+'55':'var(--border)'),background:iStatus[grupo]?getISCfg(iStatus[grupo]).bg:'transparent',color:iStatus[grupo]?getISCfg(iStatus[grupo]).c:'var(--txt3)',cursor:'pointer',outline:'none',appearance:'none',WebkitAppearance:'none'}}>
                      <option value="">+ status</option>
                      {(window._iscfg?Object.keys(window._iscfg):Object.keys(IS_CFG_BASE)).map(s=><option key={s} value={s}>{s}</option>)}
                    </select>}
                  </div>
                </div>
                {mSpans.map((ms,mi)=>{
                  if(collapsed.has(ms.lb))return <div key={mi} style={{width:CW,flexShrink:0,borderLeft:'1px solid var(--border2)',background:'rgba(255,255,255,.012)'}}/>;
                  return allWeeks.slice(ms.si,ms.si+ms.wc).map((w,wi)=>w.days.map(d=><div key={d.toISOString().slice(0,10)} style={{width:DW,flexShrink:0,background:'rgba(255,255,255,.01)',borderLeft:d.getDay()===1?'1px solid var(--border2)':'1px solid var(--border)'}}/>));
                })}
              </div>
              {gtasks.map(task=>{
                const dmap=getTaskDayMap(task);
                const cfg=SC[task.s]||{};
                return(
                  <div key={task.id} style={{display:'flex',alignItems:'stretch',minHeight:RH,borderBottom:'1px solid var(--border)'}} onMouseLeave={()=>{if(!cellEd)setTooltip(null);}}>
                    <div style={{width:NW,flexShrink:0,position:'sticky',left:0,zIndex:10,padding:'5px 10px 5px 24px',display:'flex',alignItems:'flex-start',gap:5,borderRight:'1px solid var(--border2)',background:'#FFFFFF'}}>
                      <span style={{width:5,height:5,borderRadius:'50%',background:cfg.d||'#64748B',flexShrink:0,marginTop:3}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <span style={{fontSize:12,color:'var(--txt1)',lineHeight:1.4,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',display:'block'}}>{task.t}</span>
                        {task.c&&<span style={{fontFamily:'monospace',fontSize:8,color:'var(--txt3)',display:'block',marginTop:1}}>{task.c}</span>}
                      </div>
                    </div>
                    {mSpans.map((ms,mi)=>{
                      if(collapsed.has(ms.lb)){

                      }

                            </div>
                          );

                      ));
                    })}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
          </div>{/* end content inner */}
        </div>{/* end scrollRef */}
      </div>{/* end outer flex column */}
      {tooltip&&!cellEd&&(
        <div style={{position:'fixed',left:Math.min(tooltip.x+12,window.innerWidth-280),top:Math.max(tooltip.y-100,8),background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:10,padding:'11px 14px',zIndex:60,maxWidth:270,boxShadow:'0 8px 32px rgba(0,0,0,.6)',pointerEvents:'none'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--txt1)',marginBottom:5,lineHeight:1.4}}>{tooltip.task.t}</div>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
            <span style={{width:7,height:7,borderRadius:2,background:PH[tooltip.act.ph].sl}}/>
            <span style={{fontSize:11,color:PH[tooltip.act.ph].col,fontWeight:600}}>{tooltip.act.ph==='CUSTOM'&&tooltip.act.cl?tooltip.act.cl:tooltip.act.ph==='DEV'&&tooltip.task.r?respList(tooltip.task.r).join(', '):PH[tooltip.act.ph].lb}</span>
            <span style={{fontSize:9,color:'var(--txt3)'}}>{tooltip.dk.split('-').slice(1).reverse().join('/')}</span>
          </div>
          {tooltip.act.lines.map((line,i)=>{const[dt,...rest]=line.split(' - ');return <div key={i} style={{display:'flex',gap:6,fontSize:10}}><span style={{color:'var(--cyan)',opacity:.7,fontFamily:'monospace',minWidth:32,flexShrink:0}}>{dt}</span><span style={{color:'var(--txt2)'}}>{rest.join(' - ')}</span></div>;})}
          <div style={{marginTop:6,fontSize:9,color:'var(--txt3)'}}>Clique para editar</div>
        </div>
      )}
      {cellEd&&<CellEditor ced={cellEd} onSave={saveCellDay} onDelete={delCellDay} onClose={()=>setCellEd(null)}/>}
    </div>
  );
}

function CellEditor({ced,onSave,onDelete,onClose}){
  const[ph,setPh]=useState(ced.act?ced.act.ph:'DEV');
  const[customPh,setCustomPh]=useState(ced.act&&ced.act.ph==='CUSTOM'&&ced.act.cl?ced.act.cl:'');
  const[note,setNote]=useState(ced.act?ced.act.lines[0].split(' - ').slice(1).join(' - '):'');
  const[df,setDf]=useState(ced.df);
  const[dt,setDt]=useState('');
  const[err,setErr]=useState('');
  const ref=useRef(null);
  const today=()=>new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

  useEffect(()=>{setTimeout(()=>ref.current&&ref.current.focus(),60);},[]);

  const wdBetween=(from,to)=>{
    const p=s=>{const[d,m]=s.split('/').map(Number);return new Date(2026,m-1,d);};
    const s=p(from),e=p(to||from);
    if(isNaN(s.getTime())||isNaN(e.getTime())||e<s)return null;
    const days=[];const cur=new Date(s);
    while(cur<=e){const dow=cur.getDay();if(dow>=1&&dow<=5){const dd=String(cur.getDate()).padStart(2,'0'),mm=String(cur.getMonth()+1).padStart(2,'0');days.push(dd+'/'+mm);}cur.setDate(cur.getDate()+1);}
    return days;
  };

  const save=()=>{
    const days=wdBetween(df.trim(),dt.trim()||df.trim());
    if(!days||days.length===0){setErr('Data invalida');return;}
    let finalPh=ph==='CUSTOM'?'CUSTOM':ph;
    let finalNote;
    if(ph==='CUSTOM'&&customPh.trim()){
      finalNote='['+customPh.trim()+']'+(note.trim()?' '+note.trim():'');
    }else{
      finalNote=note.trim()||PD[ph]||'Atividade planejada';
    }
    setErr('');onSave(ced.task.id,days,finalPh,finalNote);onClose();
  };

  const inpSt={background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,color:'var(--txt1)',fontSize:11,padding:'6px 9px',outline:'none',width:'100%'};
  const ex=Math.min(ced.x+8,window.innerWidth-275);
  const ey=Math.min(ced.y-10,window.innerHeight-310);

  return(
    <React.Fragment>
      <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:70}}/>
      <div style={{position:'fixed',left:ex,top:ey,width:265,background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:10,padding:'13px',zIndex:71,boxShadow:'0 8px 32px rgba(0,0,0,.7)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
          <span style={{fontSize:12,fontWeight:700,color:'var(--txt1)'}}>{ced.act?'Editar':'Planejar atividade'}</span>
          <button onClick={onClose} style={{background:'none',border:'none',color:'var(--txt2)',cursor:'pointer',fontSize:16,lineHeight:1}}>✕</button>
        </div>

function InitiativeManager({tasks,setTasks,iStatus={},setIStatus,onClose}){
  const[newN,setNewN]=useState('');
  const[ren,setRen]=useState(null);
  const[cdel,setCdel]=useState(null);
  const[mFrom,setMFrom]=useState('');
  const[mTo,setMTo]=useState('');
  const SCOL={"Em andamento":"#22D3EE","Bloqueado":"#F87171","Nao Iniciado":"#4A5568","Aguard. Deploy PRD":"#FBBF24","Paralisado":"#FB923C","Finalizado":"#34D399","Entregue":"#10B981","Pendente":"#A78BFA"};

  const grupos=useMemo(()=>{
    const map={};tasks.forEach(t=>{if(!map[t.g])map[t.g]={name:t.g,tasks:[]};map[t.g].tasks.push(t);});
    return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  },[tasks]);

  const createG=()=>{const n=newN.trim();if(!n)return;setTasks(prev=>[...prev,{id:Date.now(),g:n,t:'Nova tarefa - edite ou exclua',c:'',v:'',s:'Nao Iniciado',r:'',mr:'',a:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' - Card criado'}]);setNewN('');};
  const renameG=(orig,nw)=>{const t=nw.trim();if(!t||t===orig)return;setTasks(prev=>prev.map(x=>x.g===orig?{...x,g:t}:x));setRen(null);};
  const delG=name=>{setTasks(prev=>prev.filter(x=>x.g!==name));setCdel(null);};
  const mergeG=()=>{if(!mFrom||!mTo||mFrom===mTo)return;setTasks(prev=>prev.map(x=>x.g===mFrom?{...x,g:mTo}:x));setMFrom('');setMTo('');};

  const ist={background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt1)',fontSize:12,padding:'7px 11px',outline:'none',width:'100%'};

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.72)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:14,width:'min(740px,100%)',maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 80px rgba(0,0,0,.7)'}}>
        <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:'var(--txt1)'}}>Gerenciar Iniciativas</div>
            <div style={{fontSize:10,color:'var(--txt3)',marginTop:1}}>{grupos.length} iniciativas - {tasks.length} tarefas</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'var(--txt2)',fontSize:18,cursor:'pointer',lineHeight:1}}>x</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'18px 22px',display:'flex',flexDirection:'column',gap:16}}>
          <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:9,padding:'14px'}}>
            <div style={{fontSize:10,fontWeight:600,color:'var(--txt2)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Nova Iniciativa</div>
            <div style={{display:'flex',gap:7}}>
              <input value={newN} onChange={e=>setNewN(e.target.value)} placeholder="Ex: Destrava PIX - Fase 3" onKeyDown={e=>{if(e.key==='Enter')createG();}} style={{...ist,flex:1}} onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              <button onClick={createG} style={{padding:'7px 16px',background:'linear-gradient(135deg,var(--accent),var(--cyan))',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>+ Criar</button>
            </div>
          </div>
          <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:9,padding:'14px'}}>
            <div style={{fontSize:10,fontWeight:600,color:'var(--txt2)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Unificar Iniciativas</div>
            <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
              <select value={mFrom} onChange={e=>setMFrom(e.target.value)} style={{...ist,flex:1,minWidth:140}}><option value="">De (origem)...</option>{grupos.map(g=><option key={g.name} value={g.name}>{g.name}</option>)}</select>
              <span style={{color:'var(--txt3)',fontSize:14}}>to</span>
              <select value={mTo} onChange={e=>setMTo(e.target.value)} style={{...ist,flex:1,minWidth:140}}><option value="">Para (destino)...</option>{grupos.filter(g=>g.name!==mFrom).map(g=><option key={g.name} value={g.name}>{g.name}</option>)}</select>
              <button onClick={mergeG} disabled={!mFrom||!mTo} style={{padding:'7px 14px',background:mFrom&&mTo?'rgba(251,191,36,.15)':'rgba(255,255,255,.04)',border:'1px solid '+(mFrom&&mTo?'#FBBF24':'var(--border)'),borderRadius:8,color:mFrom&&mTo?'#FBBF24':'var(--txt3)',fontSize:11,fontWeight:600,cursor:mFrom&&mTo?'pointer':'default',whiteSpace:'nowrap'}}>Unificar</button>
            </div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:'var(--txt2)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Todas as Iniciativas</div>
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {grupos.map(g=>{
                const smap={};g.tasks.forEach(t=>{smap[t.s]=(smap[t.s]||0)+1;});
                const isR=ren&&ren.orig===g.name;const isD=cdel===g.name;
                return(
                  <div key={g.name} style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'11px 13px',display:'flex',alignItems:'center',gap:11,flexWrap:'wrap'}}>
                    <div style={{flex:'1 1 220px',minWidth:180}}>
                      {isR?<input value={ren.draft} autoFocus onChange={e=>setRen(r=>({...r,draft:e.target.value}))} onBlur={()=>renameG(g.name,ren.draft)} onKeyDown={e=>{if(e.key==='Enter')renameG(g.name,ren.draft);if(e.key==='Escape')setRen(null);}} style={{...ist,padding:'3px 9px',fontSize:12,fontWeight:600}}/>
                      :<div style={{display:'flex',alignItems:'center',gap:7}}>
                      <span style={{fontSize:12,fontWeight:600,color:'var(--txt1)'}}>{g.name}</span>
                      {iStatus[g.name]&&IS_CFG[iStatus[g.name]]&&<span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:99,background:IS_CFG[iStatus[g.name]].bg,color:IS_CFG[iStatus[g.name]].c,border:'1px solid '+IS_CFG[iStatus[g.name]].c+'33'}}>{iStatus[g.name]}</span>}
                    </div>}
                      <div style={{display:'flex',height:3,borderRadius:3,overflow:'hidden',marginTop:5,gap:1}}>{Object.entries(smap).map(([s,n])=><div key={s} title={s+': '+n} style={{flex:n,background:SCOL[s]||'#4A5568',minWidth:2}}/>)}</div>
                      <div style={{fontSize:9,color:'var(--txt3)',marginTop:3}}>{Object.entries(smap).map(([s,n])=>n+' '+s).join(' - ')}</div>
                    </div>
                    <div style={{textAlign:'center',flexShrink:0}}><div style={{fontSize:17,fontWeight:700,color:'var(--accent)'}}>{g.tasks.length}</div><div style={{fontSize:9,color:'var(--txt3)'}}>tarefas</div></div>
                    {isD?<div style={{display:'flex',gap:5,alignItems:'center'}}><span style={{fontSize:10,color:'#F87171'}}>Excluir {g.tasks.length} tarefas?</span><button onClick={()=>delG(g.name)} style={{padding:'3px 9px',borderRadius:5,background:'#F87171',border:'none',color:'#fff',fontSize:10,fontWeight:700,cursor:'pointer'}}>Sim</button><button onClick={()=>setCdel(null)} style={{padding:'3px 9px',borderRadius:5,background:'transparent',border:'1px solid var(--border)',color:'var(--txt2)',fontSize:10,cursor:'pointer'}}>Nao</button></div>
                    :<div style={{display:'flex',gap:5}}><button onClick={()=>setRen({orig:g.name,draft:g.name})} style={{padding:'4px 9px',borderRadius:6,background:'rgba(251,191,36,.08)',border:'1px solid rgba(251,191,36,.2)',color:'#FBBF24',fontSize:10,cursor:'pointer'}}>Renomear</button><button onClick={()=>setCdel(g.name)} style={{padding:'4px 9px',borderRadius:6,background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',color:'#F87171',fontSize:10,cursor:'pointer'}}>Excluir</button></div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        <div style={{padding:'12px 22px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <button onClick={onClose} style={{padding:'8px 22px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,color:'var(--txt2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function BulkCreateModal({grupo,onSave,onClose,nextId,allResp}){
  const mkRow=()=>({id:Date.now()+Math.random(),t:'',c:'',s:'Nao Iniciado',r:''});
  const[rows,setRows]=useState([mkRow()]);
  const allResp2=allResp||[];

  const setRow=(id,key,val)=>setRows(prev=>prev.map(r=>r.id===id?{...r,[key]:val}:r));
  const addRow=()=>setRows(prev=>[...prev,mkRow()]);
  const rmRow=id=>setRows(prev=>prev.length>1?prev.filter(r=>r.id!==id):prev);

  const saveAll=()=>{
    const valid=rows.filter(r=>r.t.trim());
    if(!valid.length)return;
    const today=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const items=valid.map(row=>({t:row.t.trim(),c:row.c.trim(),v:'',s:row.s,r:row.r,g:grupo,ng:'',mr:'',a:today+' - Card criado'}));
    onSave(items,nextId);
    onClose();
  };

  const handleKeyDown=(e,rowId,idx)=>{
    if(e.key==='Enter'){e.preventDefault();if(idx===rows.length-1)addRow();else document.getElementById('bcr-'+(idx+1))&&document.getElementById('bcr-'+(idx+1)).focus();}
    if(e.key==='Escape')onClose();
  };

  const valid=rows.filter(r=>r.t.trim()).length;
  const ist={background:'#F9FAFB',border:'1px solid var(--border)',borderRadius:7,color:'var(--txt1)',fontSize:13,padding:'7px 10px',outline:'none'};

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:160,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:14,width:'min(680px,100%)',maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 16px 56px rgba(0,0,0,.18)'}}>

        {/* Header */}
        <div style={{padding:'20px 24px 16px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:16,fontWeight:700,color:'var(--txt1)'}}>Criar múltiplos cards</div>
              <div style={{fontSize:12,color:'var(--txt3)',marginTop:3,display:'flex',alignItems:'center',gap:6}}>
                <span style={{padding:'1px 8px',borderRadius:99,background:'rgba(37,99,235,.1)',color:'var(--accent)',fontSize:11,fontWeight:600}}>{grupo}</span>
                <span>· Enter para avançar linha · Esc para fechar</span>
              </div>
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',color:'var(--txt3)',fontSize:18,cursor:'pointer',lineHeight:1}}>✕</button>
          </div>
        </div>

        {/* Column labels */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 110px 160px 140px 36px',gap:8,padding:'8px 24px 4px',flexShrink:0}}>
          {['Tarefa *','Card','Status','Responsável',''].map((lbl,i)=>(
            <span key={i} style={{fontSize:9,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:.7}}>{lbl}</span>
          ))}
        </div>

        {/* Rows */}
        <div style={{flex:1,overflowY:'auto',padding:'4px 24px 8px'}}>
          {rows.map((row,idx)=>(
            <div key={row.id} style={{display:'grid',gridTemplateColumns:'1fr 110px 160px 140px 36px',gap:8,marginBottom:7,alignItems:'center'}}>
              <input id={"bcr-"+idx} value={row.t} onChange={e=>setRow(row.id,'t',e.target.value)} onKeyDown={e=>handleKeyDown(e,row.id,idx)}
                placeholder={"Ex: "+idx+".1 - Descrição da tarefa"} autoFocus={idx===0}
                style={{...ist,borderColor:row.t.trim()?'var(--border)':'var(--border)'}}
                onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              <input value={row.c} onChange={e=>setRow(row.id,'c',e.target.value)} onKeyDown={e=>handleKeyDown(e,row.id,idx)}
                placeholder="STK-XXXX" style={{...ist,fontFamily:'monospace',fontSize:11}}
                onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              <select value={row.s} onChange={e=>setRow(row.id,'s',e.target.value)} style={{...ist,cursor:'pointer'}}>
                {Object.keys(SC).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(s=><option key={s} value={s}>{s}</option>)}
              </select>
              <select value={row.r} onChange={e=>setRow(row.id,'r',e.target.value)} style={{...ist,cursor:'pointer'}}>
                <option value="">— Sem responsável</option>
                {allResp2.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
              <button onClick={()=>rmRow(row.id)} style={{width:32,height:32,borderRadius:7,background:'rgba(220,38,38,.07)',border:'1px solid rgba(220,38,38,.18)',color:'#DC2626',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>×</button>
            </div>
          ))}
          <button onClick={addRow} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,background:'transparent',border:'1px dashed var(--border)',color:'var(--txt2)',fontSize:12,cursor:'pointer',marginTop:4,width:'100%',justifyContent:'center',transition:'all .15s'}} onMouseOver={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)';}} onMouseOut={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--txt2)';}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar linha
          </button>
        </div>

        {/* Footer */}
        <div style={{padding:'14px 24px',borderTop:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,background:'var(--bg2)',borderRadius:'0 0 14px 14px'}}>
          <span style={{fontSize:12,color:'var(--txt3)'}}>{valid} card{valid!==1?'s':''} pronto{valid!==1?'s':''} para criar</span>
          <div style={{display:'flex',gap:8}}>
            <button onClick={onClose} style={{padding:'8px 18px',background:'transparent',border:'1px solid var(--border)',borderRadius:8,color:'var(--txt2)',fontSize:13,fontWeight:600,cursor:'pointer'}}>Cancelar</button>
            <button onClick={saveAll} disabled={!valid} style={{padding:'8px 22px',background:valid?'linear-gradient(135deg,var(--accent),var(--cyan))':'var(--bg)',border:'none',borderRadius:8,color:valid?'#fff':'var(--txt3)',fontSize:13,fontWeight:700,cursor:valid?'pointer':'default',transition:'all .2s'}}>
              Criar {valid>0?valid+' ':''}{valid===1?'card':'cards'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
